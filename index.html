<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ホロカ デッキ構築シミュレーター</title>
<style>
:root{
  --bg:#0e1016; --bg2:#161a24; --bg3:#1e2431; --panel:#171b26; --line:#2a3344;
  --text:#e7ecf3; --muted:#8b96a9; --accent:#5ad1cf; --accent2:#7c5cff;
  --ok:#4bbf73; --warn:#e6b800; --err:#e5484d;
  --c-white:#d7dce6; --c-green:#4bbf73; --c-red:#e5484d; --c-blue:#4c8dff;
  --c-purple:#a668e8; --c-yellow:#e6b800; --c-none:#8a94a6;
  --radius:12px; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 80% -10%,#1a2030 0,var(--bg) 55%) fixed,var(--bg);
  color:var(--text); font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  font-size:14px; line-height:1.5;
}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3546;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---- header ---- */
header{
  display:flex;align-items:center;gap:14px;padding:12px 18px;
  background:linear-gradient(180deg,rgba(124,92,255,.10),transparent),var(--bg2);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#0c0e14;font-weight:900}
.logo small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.5px}
.deckname{background:var(--bg3);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 12px;min-width:180px;font-size:14px}
.deckname:focus{outline:none;border-color:var(--accent)}
.spacer{flex:1}
.btn{background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:8px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{border-color:var(--accent);background:#232a39}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#0c0e14;font-weight:700}
.btn.ghost{background:transparent}
.badge{padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.badge.ok{background:rgba(75,191,115,.16);color:var(--ok);border:1px solid rgba(75,191,115,.4)}
.badge.bad{background:rgba(229,72,77,.14);color:var(--err);border:1px solid rgba(229,72,77,.4)}

/* ---- layout ---- */
.wrap{display:grid;grid-template-columns:1fr 420px;gap:0;height:calc(100vh - 59px)}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}}
.pool{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.deck{display:flex;flex-direction:column;min-width:0;background:var(--panel)}

/* ---- filters ---- */
.filters{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:10px}
.searchrow{display:flex;gap:8px}
.search{flex:1;background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:14px}
.search:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg3);color:var(--muted);font-size:12px;transition:.12s}
.chip:hover{color:var(--text)}
.chip.on{color:#0c0e14;font-weight:700}
.chip.cat.on{background:var(--accent);border-color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:5px;border:1px solid rgba(255,255,255,.25)}
.chip.color.on{color:#fff;border-width:2px}
.sel{background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px}
.filtermeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}

/* ---- card grid ---- */
.grid{flex:1;overflow-y:auto;padding:14px 16px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;align-content:start}
.card{position:relative;border-radius:9px;overflow:hidden;background:var(--bg3);cursor:pointer;
  border:1px solid var(--line);transition:transform .1s,box-shadow .1s;aspect-ratio:63/88}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:#0b0d13}
.card .noimg{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:6px;font-size:11px;color:var(--muted)}
.card .cnum{position:absolute;top:0;left:0;background:rgba(0,0,0,.7);color:#cfd6e2;font-size:9px;padding:2px 5px;border-bottom-right-radius:6px}
.card .incount{position:absolute;bottom:6px;right:6px;background:var(--accent);color:#0c0e14;font-weight:800;
  min-width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.card .lvl{position:absolute;top:0;right:0;font-size:9px;padding:2px 5px;border-bottom-left-radius:6px;font-weight:700}
.moreBtn{grid-column:1/-1;justify-self:center;margin:8px 0 20px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}

/* ---- deck panel ---- */
.deckhead{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.counts{display:flex;gap:8px;margin-top:4px}
.countbox{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.countbox .k{font-size:11px;color:var(--muted)}
.countbox .v{font-weight:800;font-size:18px}
.countbox .v small{font-size:12px;color:var(--muted);font-weight:500}
.countbox.bad{border-color:var(--err)}.countbox.bad .v{color:var(--err)}
.countbox.good{border-color:rgba(75,191,115,.5)}.countbox.good .v{color:var(--ok)}
.decktabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2)}
.decktab{flex:1;padding:10px;text-align:center;color:var(--muted);border-bottom:2px solid transparent;font-size:13px;font-weight:600}
.decktab.on{color:var(--text);border-bottom-color:var(--accent)}
.deckbody{flex:1;overflow-y:auto;padding:12px 14px}
.section-t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 8px;font-weight:700}

/* oshi slot */
.oshislot{display:flex;gap:12px;align-items:center;background:var(--bg3);border:1px dashed var(--line);border-radius:10px;padding:10px}
.oshislot.filled{border-style:solid}
.oshislot img{width:58px;border-radius:6px}
.oshi-empty{color:var(--muted);font-size:13px}

/* deck list rows */
.drow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px}
.drow:hover{background:var(--bg3)}
.drow img{width:38px;height:53px;object-fit:cover;border-radius:4px;background:#0b0d13;cursor:pointer;flex:none}
.drow .meta{flex:1;min-width:0}
.drow .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .sub{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg3);color:var(--text);font-size:15px;font-weight:700;display:grid;place-items:center}
.stepper button:hover{border-color:var(--accent)}
.stepper .qty{min-width:24px;text-align:center;font-weight:800}
.grouplabel{font-size:11px;color:var(--muted);margin:12px 2px 4px;font-weight:700;display:flex;justify-content:space-between}

/* stats */
.stats{padding:4px 2px}
.statblock{margin-bottom:16px}
.statblock h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.bar{height:14px;border-radius:6px;background:var(--bg3);overflow:hidden;display:flex}
.bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:12px}
.legend .li{display:flex;align-items:center;gap:5px;color:var(--muted)}
.donutwrap{display:flex;align-items:center;gap:16px}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--panel)}
.donut .cx{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1}
.donut .cx b{font-size:20px}.donut .cx small{color:var(--muted);font-size:10px}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:8px;font-size:12px}
.hbar .track{height:12px;background:var(--bg3);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;border-radius:6px}
.hbar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* validation list */
.vlist{margin:8px 0 4px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.vlist li{font-size:12px;padding:7px 10px;border-radius:7px;display:flex;gap:8px;align-items:flex-start}
.vlist li.e{background:rgba(229,72,77,.12);color:#ffb4b6}
.vlist li.w{background:rgba(230,184,0,.12);color:#f2d98a}
.vlist li.ok{background:rgba(75,191,115,.12);color:#9be0b4}

/* modal */
.modal{position:fixed;inset:0;background:rgba(4,6,10,.72);display:none;z-index:50;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.modalbox{background:var(--bg2);border:1px solid var(--line);border-radius:16px;max-width:820px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.mgrid{display:grid;grid-template-columns:280px 1fr;gap:0}
@media(max-width:640px){.mgrid{grid-template-columns:1fr}}
.mgrid .mimg{padding:20px;display:grid;place-items:start center;background:var(--bg)}
.mgrid .mimg img{width:100%;max-width:260px;border-radius:10px}
.mbody{padding:22px 24px}
.mbody h3{margin:0 0 4px;font-size:20px}
.mbody .mnum{color:var(--muted);font-size:13px;margin-bottom:14px}
.kv{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:14px}
.kv .t{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px}
.txtblock{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.txtblock .lab{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.txtblock p{margin:0 0 10px;white-space:pre-wrap;font-size:13px;line-height:1.6}
.mclose{position:sticky;top:10px;float:right;margin:10px;background:var(--bg3);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:8px;font-size:18px;z-index:2}
.madd{display:flex;gap:8px;margin-top:16px}

/* toast + dialog */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--bg3);border:1px solid var(--accent);color:var(--text);padding:11px 18px;border-radius:10px;
  box-shadow:var(--shadow);z-index:60;transition:.25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dlg{position:fixed;inset:0;background:rgba(4,6,10,.72);display:none;z-index:55;align-items:center;justify-content:center;padding:20px}
.dlg.on{display:flex}
.dlgbox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:560px;width:100%;box-shadow:var(--shadow)}
.dlgbox h3{margin:0 0 10px}
.dlgbox textarea{width:100%;height:120px;background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
.dlgbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.savedlist{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:300px;overflow:auto}
.savedrow{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.savedrow .nm{flex:1;font-weight:600}
.savedrow small{color:var(--muted)}

/* auto-build + battle */
.dlgbox.wide{max-width:720px}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.colorprev{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.recipe-preview{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12px;color:var(--muted);max-height:160px;overflow:auto}
.recipe-preview b{color:var(--text)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:10px 0}
.vscard{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:12px}
.vscard.a{border-color:rgba(90,209,207,.5)}.vscard.b{border-color:rgba(124,92,255,.5)}
.vscard h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:6px}
.vscard .oshi{font-size:12px;color:var(--muted)}
.vscard .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.vsmid{display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:20px}
.winbar{height:34px;border-radius:8px;overflow:hidden;display:flex;margin:14px 0 6px;border:1px solid var(--line)}
.winbar .wa{background:linear-gradient(90deg,#3fb6b4,#5ad1cf);display:grid;place-items:center;color:#04120f;font-weight:800;font-size:13px;min-width:40px}
.winbar .wb{background:linear-gradient(90deg,#7c5cff,#9a7cff);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;min-width:40px}
.simmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:6px}
.battlelog{background:#0b0d13;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.7;max-height:220px;overflow:auto;white-space:pre-wrap}
.battlelog .ta{color:#7fe3e1}.battlelog .tb{color:#b9a6ff}.battlelog .dmg{color:#f2d98a}.battlelog .ko{color:#ff9ba0;font-weight:700}
.mini-note{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}

/* ---- mobile bottom nav ---- */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--bg2);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));
  justify-content:center;gap:4px}
.bottomnav button{flex:1;max-width:180px;background:none;border:none;color:var(--muted);font-size:11px;
  padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.bottomnav button.on{color:var(--accent)}
.bottomnav button .ico{font-size:18px}

/* ---- mobile responsive ---- */
@media(max-width:1024px){
  body{padding-bottom:calc(52px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
  .bottomnav{display:flex}

  /* header compact */
  header{padding:8px 12px;gap:8px}
  .logo{font-size:13px;gap:8px}
  .logo .mark{width:26px;height:26px;font-size:12px}
  .logo small{font-size:10px}
  .deckname{min-width:0;flex:1;padding:6px 10px;font-size:13px}
  .spacer{display:none}
  .badge{padding:4px 10px;font-size:11px}
  .btn{padding:6px 10px;font-size:12px}
  #btnShare,#btnExport{display:none}

  /* layout: pool/deck toggle via class */
  .wrap{height:calc(100vh - 52px - 52px - env(safe-area-inset-bottom,0px));grid-template-columns:1fr}
  .wrap .deck{display:none}
  .wrap.show-deck .pool{display:none}
  .wrap.show-deck .deck{display:flex}
  .pool{border-right:none}

  /* filters compact */
  .filters{padding:8px 10px;gap:6px}
  .searchrow{gap:4px}
  .search{padding:8px 10px;font-size:13px}
  .sel{padding:6px 8px;font-size:11px}
  .chip{padding:6px 10px;font-size:11px;-webkit-tap-highlight-color:transparent}
  .dot{width:10px;height:10px}

  /* card grid: 3 columns */
  .grid{padding:8px;gap:8px;grid-template-columns:repeat(3,1fr)}

  /* deck panel */
  .deckhead{padding:8px 12px}
  .countbox{padding:6px 8px}
  .countbox .v{font-size:16px}
  .deckbody{padding:8px 10px}
  .drow{padding:6px 4px}
  .drow img{width:34px;height:47px}
  .drow .nm{font-size:12px}
  .stepper button{width:32px;height:32px;font-size:17px}
  .stepper .qty{min-width:28px;font-size:14px}

  /* modal full-screen on mobile */
  .modal{padding:0;align-items:stretch}
  .modalbox{max-width:100%;max-height:100vh;border-radius:0}
  .mgrid{grid-template-columns:1fr}
  .mgrid .mimg{padding:12px;display:flex;justify-content:center}
  .mgrid .mimg img{max-width:180px}
  .mbody{padding:14px 16px}
  .mbody h3{font-size:17px}
  .madd{flex-wrap:wrap}
  .madd .btn{flex:1;min-width:120px;justify-content:center;padding:10px 12px}

  /* dialog */
  .dlg{padding:10px}
  .dlgbox{padding:14px;max-width:100%;border-radius:12px}
  .dlgbox.wide{max-width:100%}
  .dlgbox h3{font-size:16px}
  .dlgbox textarea{font-size:13px;height:100px}
  .dlgbox .row{flex-wrap:wrap}
  .dlgbox .row .btn{flex:1;min-width:100px;justify-content:center;padding:9px 10px}
  .field select,.field input{font-size:16px;padding:10px 12px}

  /* battle vs cards stack */
  .vs{grid-template-columns:1fr;gap:8px}
  .vsmid{padding:2px 0;font-size:16px}
  .winbar{height:30px;font-size:12px}
  .battlelog{font-size:10.5px;max-height:180px}

  /* saved list */
  .savedrow{flex-wrap:wrap;gap:6px;padding:10px}
  .savedrow .nm{min-width:100%;font-size:13px}
  .savedrow .btn{flex:1;justify-content:center;padding:8px}

  /* toast */
  .toast{bottom:calc(60px + env(safe-area-inset-bottom,0px));font-size:13px}

  /* recipe preview */
  .recipe-preview{font-size:11px}
  .colorprev{flex-wrap:wrap}
}

/* ---- tablet grid (wider cards) ---- */
@media(min-width:600px) and (max-width:1024px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:12px}
  #btnShare,#btnExport{display:inline-flex}
}

/* =============== interactive battle view =============== */
#battleView{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;overflow-y:auto}
#battleView.open{display:flex}
.bv-top{display:flex;align-items:center;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--line);gap:8px;flex-shrink:0}
.bv-top .turn-info{flex:1;font-weight:700;font-size:14px;color:var(--accent)}
.bv-top .phase-info{font-size:11px;color:var(--muted)}
.bv-quit{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:12px}

.bv-field{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.bv-divider{height:2px;background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent) 70%,transparent);margin:0;opacity:.3}

/* --- play mat half --- */
.bv-half{position:relative;display:grid;gap:4px;padding:6px 4px;
  grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center}
.bv-half.op{flex:0 0 auto;background:linear-gradient(180deg,rgba(154,124,255,.08),transparent)}
.bv-half.me{flex:0 0 auto;background:linear-gradient(0deg,rgba(90,209,207,.08),transparent)}

/* left zone: life + cheer deck */
.bv-zone-left{grid-row:1/3;grid-column:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px}
.bv-zone-left .zone-label{font-size:8px;color:var(--muted)}

/* card-back pattern for zone stacks */
.zone-stack-wrap{position:relative;width:40px;height:56px}
.zone-stack-wrap .zs-card{position:absolute;width:40px;height:56px;border-radius:4px;
  background:linear-gradient(135deg,#1a1040 0%,#221455 40%,#1a1040 100%);
  border:1px solid rgba(124,92,255,.35);
  box-shadow:0 1px 3px rgba(0,0,0,.4);overflow:hidden}
.zone-stack-wrap .zs-card::before{content:'';position:absolute;inset:3px;border:1px solid rgba(124,92,255,.2);border-radius:2px}
.zone-stack-wrap .zs-card::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(124,92,255,.07) 5px,rgba(124,92,255,.07) 6px),
  repeating-linear-gradient(-45deg,transparent,transparent 5px,rgba(124,92,255,.07) 5px,rgba(124,92,255,.07) 6px);
  mask:radial-gradient(ellipse 70% 70% at 50% 50%,#000 40%,transparent 100%)}
.zone-stack-wrap .zs-card .zs-diamond{position:absolute;top:50%;left:50%;width:14px;height:14px;transform:translate(-50%,-50%) rotate(45deg);border:1.5px solid rgba(154,124,255,.35);background:rgba(124,92,255,.1)}
.zone-stack-wrap .zs-c0{z-index:3}
.zone-stack-wrap .zs-c1{z-index:2;transform:translate(2px,2px)}
.zone-stack-wrap .zs-c2{z-index:1;transform:translate(4px,4px)}
.zone-stack-wrap .zs-badge{position:absolute;z-index:5;bottom:-2px;right:-4px;min-width:16px;height:16px;
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  font-size:9px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}
.zone-stack-wrap.life .zs-card{border-color:rgba(229,72,77,.4);background:linear-gradient(135deg,#2a0c18 0%,#1a1040 100%)}
.zone-stack-wrap.life .zs-card .zs-diamond{border-color:rgba(229,72,77,.35);background:rgba(229,72,77,.12)}
.zone-stack-wrap.life .zs-badge{border-color:rgba(229,72,77,.5);color:var(--err)}
.zone-stack-wrap.cheer-pile .zs-card{border-color:rgba(90,209,207,.3);background:linear-gradient(135deg,#0d2228 0%,#1a1040 100%)}
.zone-stack-wrap.cheer-pile .zs-card .zs-diamond{border-color:rgba(90,209,207,.3);background:rgba(90,209,207,.1)}
.zone-stack-wrap.cheer-pile .zs-badge{border-color:rgba(90,209,207,.4);color:var(--accent)}
.zone-stack-wrap.hp-zone .zs-card{border-color:rgba(124,92,255,.4)}
.zone-stack-wrap.hp-zone .zs-badge{border-color:rgba(124,92,255,.5);color:var(--accent2)}
.zone-stack-wrap.archive-zone{opacity:.6}
.zone-stack-wrap.empty .zs-card{background:transparent;border:2px dashed var(--line);box-shadow:none}
.zone-stack-wrap.empty .zs-card::before,.zone-stack-wrap.empty .zs-card::after{display:none}
.zone-stack-wrap.empty .zs-card .zs-diamond{display:none}
.zone-stack-wrap.empty .zs-badge{display:none}

/* center: oshi + collab + center row, back row */
.bv-zone-center{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:center;gap:3px}
.bv-stage-row{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.bv-back-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.bv-pos-tag{font-size:7px;color:var(--muted);text-align:center;margin-top:-2px;letter-spacing:.3px}

/* right zone: holo power + deck + archive */
.bv-zone-right{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px}
.bv-zone-right .zone-label{font-size:8px;color:var(--muted)}

/* player name bar */
.bv-name-bar{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 4px;font-size:11px;color:var(--muted)}
.bv-half.op .bv-name-bar{grid-row:1;padding-bottom:2px}
.bv-half.me .bv-name-bar{grid-row:1;padding-bottom:2px}
.bv-name-bar .name{font-weight:700;color:var(--text);font-size:12px}
.bv-name-bar .life-pips{display:flex;gap:2px}
.bv-name-bar .pip{width:9px;height:9px;border-radius:50%;background:var(--err);border:1px solid rgba(255,255,255,.15)}
.bv-name-bar .pip.lost{background:var(--bg3);opacity:.3}

/* slots */
.bv-slot{width:52px;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;transition:transform .15s}
.bv-slot:hover{transform:scale(1.08)}
.bv-slot.selectable{animation:pulse 1.2s infinite}
.bv-slot.selected{outline:2px solid var(--accent);border-radius:6px}
.bv-slot .card-thumb{width:50px;height:70px;border-radius:4px;object-fit:cover;border:2px solid var(--line);display:block}
.bv-slot.selectable .card-thumb{border-color:var(--accent);box-shadow:0 0 8px rgba(90,209,207,.5)}
.bv-slot .hp-bar{width:46px;height:3px;background:var(--bg3);border-radius:2px;margin-top:1px;overflow:hidden}
.bv-slot .hp-fill{height:100%;background:var(--ok);transition:width .3s}
.bv-slot .hp-fill.warn{background:var(--warn)}
.bv-slot .hp-fill.crit{background:var(--err)}
.bv-slot .slot-label{font-size:7px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52px}
.bv-slot .cheer-dots{display:flex;gap:1px;justify-content:center;flex-wrap:wrap;max-width:52px}
.bv-slot .cdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.bv-slot-empty{width:50px;height:70px;border-radius:4px;border:2px dashed var(--line);opacity:.25;display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--muted)}
.bv-slot .dmg-text{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.75);color:var(--err);font-size:8px;font-weight:700;padding:1px 3px;border-radius:3px}
.bv-slot .buff-text{position:absolute;top:1px;left:1px;background:rgba(0,0,0,.75);color:var(--accent);font-size:8px;font-weight:700;padding:1px 3px;border-radius:3px}
.bv-slot.oshi-slot .card-thumb{border-color:rgba(124,92,255,.5);border-radius:6px}
.bv-slot.rested .card-thumb{opacity:.55;filter:saturate(.5)}

/* hand */
.bv-hand{flex-shrink:0;overflow-x:auto;display:flex;gap:4px;padding:4px 8px;background:var(--bg2);border-top:1px solid var(--line);scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.bv-hand .hand-card{width:46px;height:64px;border-radius:4px;object-fit:cover;border:2px solid var(--line);cursor:pointer;flex-shrink:0;transition:transform .15s}
.bv-hand .hand-card:hover{transform:translateY(-4px)}
.bv-hand .hand-card.selectable{border-color:var(--accent);box-shadow:0 0 6px rgba(90,209,207,.4);animation:pulse 1.2s infinite}
.bv-hand .hand-card.selected{border-color:var(--ok);box-shadow:0 0 8px rgba(75,191,115,.5)}
.bv-field-prompt{position:absolute;left:50%;transform:translateX(-50%);z-index:8;background:rgba(14,16,22,.88);
  border:1px solid var(--accent);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;
  color:var(--accent);text-align:center;white-space:nowrap;pointer-events:none;
  animation:pulse 1.2s infinite;bottom:4px}

/* actions */
.bv-actions{flex-shrink:0;background:var(--bg2);border-top:1px solid var(--line);padding:6px 8px;max-height:180px;overflow-y:auto}
.bv-actions .prompt{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px}
.bv-actions .act-list{display:flex;flex-wrap:wrap;gap:4px}
.bv-actions .act-btn{background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;transition:background .15s}
.bv-actions .act-btn:hover{background:var(--accent);color:#000}
.bv-actions .act-btn.end{border-color:var(--warn);color:var(--warn)}
.bv-actions .act-btn.end:hover{background:var(--warn);color:#000}

/* log */
.bv-log{flex-shrink:0;max-height:80px;overflow-y:auto;background:#0b0d13;padding:4px 8px;font-family:ui-monospace,monospace;font-size:10px;line-height:1.5;border-top:1px solid var(--line);scrollbar-width:thin}
.bv-log .ta{color:#7fe3e1}.bv-log .tb{color:#b9a6ff}.bv-log .ko{color:#ff9ba0;font-weight:700}
.bv-log .log-line{white-space:pre-wrap}

.bv-result{position:absolute;inset:0;background:rgba(14,16,22,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10}
.bv-result h2{font-size:24px;margin:0}
.bv-result .win-a{color:#5ad1cf}.bv-result .win-b{color:#9a7cff}
.bv-result .detail{font-size:13px;color:var(--muted)}

@keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(90,209,207,.3)}50%{box-shadow:0 0 12px rgba(90,209,207,.7)}}

/* battle animations */
@keyframes bv-attack{0%{transform:translateX(0)}25%{transform:translateX(12px) scale(1.05)}50%{transform:translateX(-4px)}100%{transform:translateX(0)}}
@keyframes bv-damage{0%{filter:brightness(1)}15%{filter:brightness(2.5) saturate(0)}30%{transform:translateX(-6px)}45%{transform:translateX(6px)}60%{transform:translateX(-3px)}75%{transform:translateX(3px)}100%{filter:brightness(1);transform:translateX(0)}}
@keyframes bv-bloom{0%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.15);filter:brightness(1.6) hue-rotate(30deg)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes bv-collab{0%{transform:translateY(0)}30%{transform:translateY(-10px)}60%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes bv-down{0%{opacity:1;transform:rotate(0)}60%{opacity:.5;transform:rotate(8deg) scale(.9)}100%{opacity:0;transform:rotate(12deg) scale(.7) translateY(20px)}}
@keyframes bv-dmg-popup{0%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-30px) scale(.8)}}
@keyframes bv-toast-in{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes bv-toast-out{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}}
.bv-slot.anim-attack .card-thumb{animation:bv-attack .4s ease-out}
.bv-slot.anim-damage .card-thumb{animation:bv-damage .5s ease-out}
.bv-slot.anim-bloom .card-thumb{animation:bv-bloom .6s ease-out}
.bv-slot.anim-collab .card-thumb{animation:bv-collab .4s ease-out}
.bv-slot.anim-down{animation:bv-down .6s forwards}
.bv-dmg-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;color:#ff5555;text-shadow:0 0 8px #ff0000,0 2px 4px rgba(0,0,0,.8);pointer-events:none;z-index:20;animation:bv-dmg-popup 1.2s forwards}
.bv-event-toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;
  background:rgba(14,16,22,.9);border:2px solid var(--accent2);border-radius:12px;padding:10px 20px;
  font-size:14px;font-weight:700;color:var(--text);text-align:center;white-space:nowrap;
  animation:bv-toast-in .3s ease-out forwards;pointer-events:none}
.bv-event-toast.out{animation:bv-toast-out .3s forwards}

/* card-image picker for deck search / reveal choices */
.bv-pick-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px;
  max-height:44vh;overflow-y:auto;padding:4px 2px}
.bv-pick-card{position:relative;width:74px;cursor:pointer;border:2px solid #555;border-radius:8px;
  padding:3px;background:rgba(0,0,0,.35);transition:border-color .15s,transform .15s;flex:0 0 auto}
.bv-pick-card:hover,.bv-pick-card:focus-visible{border-color:var(--pick-accent,#ffca28);transform:translateY(-3px)}
.bv-pick-card img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:5px;display:block}
.bv-pick-ph{width:100%;aspect-ratio:5/7;border-radius:5px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:10px;line-height:1.2;padding:4px;background:#222836;color:var(--text)}
.bv-pick-cap{margin-top:3px;text-align:center;line-height:1.25}
.bv-pick-cap .nm{display:block;font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bv-pick-cap .ty{display:block;font-size:9px;color:#9aa4b5}
.bv-pick-dup{position:absolute;top:1px;right:1px;background:rgba(14,16,22,.92);border:1px solid var(--pick-accent,#ffca28);
  color:var(--pick-accent,#ffca28);border-radius:8px;font-size:9px;font-weight:800;padding:1px 5px;pointer-events:none}

@media(min-width:600px){
  .bv-slot{width:68px}
  .bv-slot .card-thumb{width:66px;height:92px}
  .bv-slot .hp-bar{width:62px}
  .bv-slot .slot-label{max-width:68px;font-size:8px}
  .bv-hand .hand-card{width:56px;height:78px}
  .zone-stack-wrap{width:46px;height:64px}
  .zone-stack-wrap .zs-card{width:46px;height:64px}
  .zone-stack-wrap .zs-badge{font-size:10px;min-width:18px;height:18px}
  .zone-stack-wrap .zs-card .zs-diamond{width:18px;height:18px}
  .bv-pick-card{width:92px}
  .bv-pick-cap .nm{font-size:11px}
}

.card-popup{display:none;position:fixed;z-index:300;background:var(--bg2);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.6);max-width:320px;width:90vw;overflow:hidden;pointer-events:none}
.card-popup.on{display:flex;flex-direction:column}
.card-popup .cp-img{width:100%;aspect-ratio:63/88;object-fit:cover;background:var(--bg3);display:block}
.card-popup .cp-body{padding:8px 10px;max-height:260px;overflow-y:auto;scrollbar-width:thin}
.card-popup .cp-name{font-weight:700;font-size:14px;margin-bottom:2px}
.card-popup .cp-meta{font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;flex-wrap:wrap;gap:4px}
.card-popup .cp-meta span{background:var(--bg3);padding:1px 6px;border-radius:4px}
.card-popup .cp-stats{font-size:12px;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
.card-popup .cp-stats .hp{color:var(--ok);font-weight:700}
.card-popup .cp-stats .dmg{color:var(--err);font-weight:700}
.card-popup .cp-stats .cheer{color:var(--accent)}
.card-popup .cp-text{font-size:11px;color:var(--text);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.card-popup .cp-text .cp-label{color:var(--accent);font-weight:700;font-size:10px;display:block;margin-top:4px}
.card-popup .cp-attach{margin-top:4px;padding-top:4px;border-top:1px solid var(--line);font-size:11px}
.card-popup .cp-attach .att-name{color:var(--accent2);font-weight:600}

<body>
<header>
  <div class="logo"><span class="mark">HC</span><div>ホロカ デッキ構築シミュレーター<small id="metaline">hololive OFFICIAL CARD GAME</small></div></div>
  <input class="deckname" id="deckname" placeholder="デッキ名を入力" value="無題のデッキ">
  <div class="spacer"></div>
  <span id="valbadge" class="badge bad">— </span>
  <button class="btn primary" id="btnAuto">⚡ 自動構築</button>
  <button class="btn" id="btnBattle">⚔ 対戦</button>
  <button class="btn" id="btnSaved">💾 保存デッキ</button>
  <button class="btn" id="btnShare">🔗 共有</button>
  <button class="btn" id="btnExport">⬇ 書き出し</button>
  <button class="btn ghost" id="btnClear">クリア</button>
</header>

<div class="wrap">
  <!-- POOL -->
  <section class="pool">
    <div class="filters">
      <div class="searchrow">
        <input class="search" id="q" placeholder="🔍 カード名・番号・テキスト・タグで検索">
        <select class="sel" id="setSel"><option value="">全収録商品</option></select>
        <select class="sel" id="sortSel">
          <option value="num">番号順</option>
          <option value="name">名前順</option>
          <option value="hp">HP順</option>
        </select>
      </div>
      <div class="chips" id="catChips"></div>
      <div class="chips" id="colorChips"></div>
      <div class="chips" id="levelChips"></div>
      <div class="filtermeta"><span id="poolCount">—</span><button class="chip" id="resetF">条件をリセット</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- DECK -->
  <section class="deck">
    <div class="deckhead">
      <div class="counts">
        <div class="countbox" id="cOshi"><div class="k">推し</div><div class="v">0<small>/1</small></div></div>
        <div class="countbox" id="cMain"><div class="k">メインデッキ</div><div class="v">0<small>/50</small></div></div>
        <div class="countbox" id="cCheer"><div class="k">エールデッキ</div><div class="v">0<small>/20</small></div></div>
      </div>
    </div>
    <div class="decktabs">
      <div class="decktab on" data-tab="list">デッキ</div>
      <div class="decktab" data-tab="stats">統計</div>
      <div class="decktab" data-tab="check">ルール診断</div>
    </div>
    <div class="deckbody" id="deckBody"></div>
  </section>
</div>

<nav class="bottomnav" id="bottomNav">
  <button class="on" data-view="pool"><span class="ico">🔍</span>カード</button>
  <button data-view="deck"><span class="ico">📋</span>デッキ<span id="deckBadge"></span></button>
  <button data-view="battle"><span class="ico">⚔</span>対戦</button>
  <button data-view="more"><span class="ico">…</span>その他</button>
</nav>

<div id="battleView">
  <div class="bv-top">
    <span class="turn-info" id="bvTurn">対戦準備中</span>
    <span class="phase-info" id="bvPhase"></span>
    <button class="bv-quit" id="bvQuit">✕ 退出</button>
  </div>
  <div class="bv-field" id="bvField">
    <div class="bv-half op" id="bvOpHalf">
      <div class="bv-name-bar" id="bvOpInfo"></div>
      <div class="bv-zone-left" id="bvOpLeft"></div>
      <div class="bv-zone-center" id="bvOpStage">
        <div class="bv-stage-row" id="bvOpFront"></div>
        <div class="bv-back-row" id="bvOpBack"></div>
      </div>
      <div class="bv-zone-right" id="bvOpRight"></div>
    </div>
    <div class="bv-divider"></div>
    <div class="bv-half me" id="bvMeHalf">
      <div class="bv-name-bar" id="bvMeInfo"></div>
      <div class="bv-zone-left" id="bvMeLeft"></div>
      <div class="bv-zone-center" id="bvMeStage">
        <div class="bv-stage-row" id="bvMeFront"></div>
        <div class="bv-back-row" id="bvMeBack"></div>
      </div>
      <div class="bv-zone-right" id="bvMeRight"></div>
    </div>
  </div>
  <div class="bv-hand" id="bvHand"></div>
  <div class="bv-actions" id="bvActions" style="display:none"></div>
  <div class="bv-log" id="bvLog"></div>
</div>

<div class="card-popup" id="cardPopup"><img class="cp-img" id="cpImg"><div class="cp-body" id="cpBody"></div></div>
<div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div>

        if (v === '◇' || v === '◆') { cost.any++; cost.total++; }
        else if (COLORS.includes(v)) { cost.colors[v] = (cost.colors[v] || 0) + 1; cost.total++; }
      });
    }
    const rest = (m ? line.slice(m[1].length) : line).replace(/\[[^\]]*\]/g, ' ');
    const nums = (rest.match(/\d+/g) || []).map(Number);
    return { cost, power: nums.length ? nums[nums.length - 1] : 0 };
  }
  // NOTE: arts kept in ORIGINAL printed order (not sorted) so DSL effects.arts[i]
  // (indexed top-to-bottom as printed) lines up with this array.
  function analyzeCard(c, fx) {
    const arts = (c.tx && c.tx.a || []).map(parseArt);
    const baton = (c.bt || '').split('').filter((ch) => ch === '◇' || ch === '◆').length;
    return { arts, baton, fx: fx || null };
  }

  /* ---------- cheer payment ---------- */
  function canPay(cost, cheer) {
    const pool = {};
    cheer.forEach((c) => (pool[c] = (pool[c] || 0) + 1));
    for (const col in cost.colors) { if ((pool[col] || 0) < cost.colors[col]) return false; pool[col] -= cost.colors[col]; }
    let rem = 0; for (const k in pool) rem += pool[k];
    return rem >= cost.any;
  }
  function effCost(art, holo) {
    const reduce = (holo && holo.costReduce) || 0;
    if (!reduce) return art.cost;
    const c = { any: Math.max(0, art.cost.any - reduce), colors: art.cost.colors, total: Math.max(0, art.cost.total - reduce) };
    return c;
  }
  function bestArt(holo, DB) {
    const entry = DB.get(holo.card.n);
    const arts = entry.arts;
    let best = null, bestIdx = -1;
    arts.forEach((art, i) => {
      if (canPay(effCost(art, holo), holo.cheer)) {
        const power = art.power + (holo.buffArt || 0);
        if (!best || power > best.power) { best = { power, idx: i, base: art }; bestIdx = i; }
      }
    });
    return best;
  }
  function topArtPower(card, DB) {
    const e = DB.get(card.n); if (!e) return 0;
    const a = e.arts; return a.length ? Math.max(...a.map((x) => x.power)) : 0;
  }
  function fxOf(DB, n) { const e = DB.get(n); return (e && e.fx) || null; }

  /* ---------- rng ---------- */
  function mulberry32(seed) { return function () { let t = (seed += 0x6D2B79F5); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  /* ---------- build player from a deck object ---------- */
  function expand(store, DB) { const out = []; for (const n in store) { const c = DB.get(n); for (let i = 0; i < store[n]; i++) out.push(c); } return out; }
  let HOLO_ID = 1;
  function makeHolo(card) {
    return {
      id: HOLO_ID++, card, dmg: 0, cheer: [], rested: false, playedTurn: -1, bloomedTurn: -1,
      attachments: [], buffArt: 0, costReduce: 0,
    };
  }

  function newPlayer(deckObj, DB, rnd, name) {
    const oshi = DB.get(deckObj.oshi);
    const p = {
      name: name || (deckObj.name || 'Player'),
      oshiCard: oshi,
      deck: shuffle(expand(deckObj.main, DB), rnd),
      cheerDeck: shuffle(expand(deckObj.cheer, DB), rnd),
      hand: [], center: null, back: [], collab: null, archive: [], holoPower: [],
      life: oshi.lf || 5, usedCollab: false, lost: false, lostReason: null,
      usedTurn: new Set(), usedGame: new Set(), limitedUsedTurn: false,
    };
    return p;
  }

  /* ================= Effect DSL interpreter ================= */
  function pickLowestHpTarget(list) {
    // prefer near-lethal (would KO), else lowest remaining HP
    let best = null, bestRem = Infinity;
    list.forEach((h) => { const rem = (h.card.hp || 0) - h.dmg; if (rem < bestRem) { bestRem = rem; best = h; } });
    return best;
  }
  function pickTopAttacker(list, DB) {
    let best = null, bestPow = -1;
    list.forEach((h) => { const p = topArtPower(h.card, DB) + (h.buffArt || 0); if (p > bestPow) { bestPow = p; best = h; } });
    return best;
  }
  function pickMostDamaged(list) {
    let best = null, bestDmg = -1;
    list.forEach((h) => { if (h.dmg > bestDmg) { bestDmg = h.dmg; best = h; } });
    return best;
  }
  function resolveTargets(kind, ctx) {
    const { game, me, op, self } = ctx;
    switch (kind) {
      case 'self': return self ? [self] : [];
      case 'center': return me.center ? [me.center] : [];
      case 'collab': return me.collab ? [me.collab] : [];
      case 'allSelf': return game.allHolos(me);
      case 'allOpponent': return game.allHolos(op);
      case 'opponentCenter': return op.center ? [op.center] : [];
      case 'chosenOpponent': { const t = pickLowestHpTarget(game.allHolos(op)); return t ? [t] : []; }
      case 'chosenSelf': { const t = pickTopAttacker(game.allHolos(me), game.DB); return t ? [t] : []; }
      case 'mostDamagedSelf': { const t = pickMostDamaged(game.allHolos(me)); return t ? [t] : []; }
      case 'backStage': return me.back.slice();
      case 'backOpponent': return op.back.slice();
      case 'collabOpponent': return op.collab ? [op.collab] : [];
      case 'chosenBackOpponent': { const t = pickLowestHpTarget(op.back); return t ? [t] : []; }
      case 'allField': return game.allHolos(me).concat(game.allHolos(op));
      default: return [];
    }
  }
  function checkCondition(cond, ctx) {
    if (!cond) return true;
    const { self, me, op } = ctx;
    if (cond.colorEquals && !(self && self.card.c && self.card.c.includes(cond.colorEquals))) return false;
    if (cond.tagIncludes && !(self && self.card.tg && self.card.tg.includes(cond.tagIncludes))) return false;
    if (cond.nameEquals && !(self && self.card.nm === cond.nameEquals)) return false;
    if (cond.hpAtMost != null && !(self && ((self.card.hp || 0) - self.dmg) <= cond.hpAtMost)) return false;
    if (cond.lifeAtMost != null && !(me.life <= cond.lifeAtMost)) return false;
    if (cond.handSizeAtLeast != null && !(me.hand.length >= cond.handSizeAtLeast)) return false;
    return true;
  }
  function matchesFilter(card, filter) {
    if (!filter) return true;
    if (filter.cardType && card.t !== filter.cardType) return false;
    if (filter.nameIncludes && !(card.nm || '').includes(filter.nameIncludes)) return false;
    if (filter.tag && !(card.tg || []).includes(filter.tag)) return false;
    if (filter.bloomLevel && card.bl !== filter.bloomLevel) return false;
    if (filter.color && !(card.c || []).includes(filter.color)) return false;
    return true;
  }

  function runActions(actions, ctx) {
    if (!actions) return;
    for (const a of actions) runAction(a, ctx);
  }
  function runAction(a, ctx) {
    const { game, me, op, rnd } = ctx;
    switch (a.op) {
      case 'draw': game.draw(me, a.n); break;
      case 'reveal': {
        const n = Math.min(a.n, me.deck.length);
        const seen = me.deck.splice(0, n);
        const match = seen.filter((c) => matchesFilter(c, a.filter));
        const take = match.slice(0, a.keep);
        take.forEach((c) => me.hand.push(c));
        const rest = seen.filter((c) => !take.includes(c));
        me.deck = rest.concat(me.deck); // return remaining to top, deck order preserved
        if (take.length) game.push('', `${me.name}: 効果でカードを${take.length}枚手札に加えた`);
        break;
      }
      case 'buffArt': {
        const targets = resolveTargets(a.target, ctx);
        targets.forEach((h) => { h.buffArt = (h.buffArt || 0) + a.amount; });
        break;
      }
      case 'specialDamage': {
        const targets = resolveTargets(a.target, ctx);
        targets.forEach((h) => {
          const holderP = game.allHolos(me).includes(h) ? me : op;
          h.dmg += a.amount;
          game.push('', `${holderP.name}: ${h.card.nm} に特殊ダメージ${a.amount}`);
          if (h === holderP.center && h.dmg >= (h.card.hp || 0)) game.downCenter(holderP, holderP === me ? op : me);
        });
        break;
      }
      case 'heal': {
        const targets = resolveTargets(a.target, ctx);
        targets.forEach((h) => { h.dmg = a.amount === 'full' ? 0 : Math.max(0, h.dmg - a.amount); });
        break;
      }
      case 'dice': {
        const roll = 1 + Math.floor(rnd() * 6);
        const key = String(roll);
        const branch = (a.then && (a.then[key] || (roll % 2 === 0 ? a.then.even : a.then.odd) ||
          Object.keys(a.then).find((k) => k.startsWith('>=') && roll >= Number(k.slice(2))) && a.then[Object.keys(a.then).find((k) => k.startsWith('>=') && roll >= Number(k.slice(2)))]));
        game.push('', `${me.name}: サイコロ${roll}`);
        if (branch) runActions(branch, ctx);
        break;
      }
      case 'attachCheer': {
        const targets = resolveTargets(a.target, ctx);
        if (targets.length && me.cheerDeck.length) {
          const t = targets[0];
          for (let i = 0; i < (a.n || 1) && me.cheerDeck.length; i++) {
            const ch = me.cheerDeck.shift();
            t.cheer.push((ch.c && ch.c[0]) || '無');
          }
          game.push('', `${me.name}: 効果で${t.card.nm} にエール${a.n || 1}枚`);
        }
        break;
      }
      case 'costReduce': {
        const targets = resolveTargets(a.target, ctx);
        targets.forEach((h) => { h.costReduce = (h.costReduce || 0) + (a.amount || 1); });
        break;
      }
      case 'archiveSelf': { if (ctx.self) archiveHolo(game, me, ctx.self); break; }
      case 'shuffleDeck': shuffle(me.deck, rnd); break;
      case 'lifeChange': me.life = Math.max(0, me.life + a.delta); break;
      case 'if': { if (checkCondition(a.cond, ctx)) runActions(a.then, ctx); else if (a.else) runActions(a.else, ctx); break; }
      case 'returnToHand': {
        const targets = resolveTargets(a.target, ctx);
        targets.forEach((h) => {
          const owner = game.allHolos(me).includes(h) ? me : op;
          if (owner.center === h) { owner.center = null; }
          else if (owner.collab === h) { owner.collab = null; }
          else { const bi = owner.back.indexOf(h); if (bi >= 0) owner.back.splice(bi, 1); }
          owner.hand.push(h.card);
          game.push('', `${owner.name}: ${h.card.nm} を手札に戻した`);
          if (!owner.center && owner.back.length) {
            const pr = owner.back.sort((x, y) => topArtPower(y.card, game.DB) - topArtPower(x.card, game.DB))[0];
            owner.back.splice(owner.back.indexOf(pr), 1); owner.center = pr;
          }
        });
        break;
      }
      case 'sendToArchive': {
        const targets = resolveTargets(a.target, ctx);
        targets.forEach((h) => {
          const owner = game.allHolos(me).includes(h) ? me : op;
          for (let i = 0; i < (a.n || 1) && h.cheer.length; i++) {
            owner.archive.push({ t: 'cheer', c: [h.cheer.pop()] });
          }
          game.push('', `${owner.name}: ${h.card.nm} からエール${a.n || 1}枚をアーカイブ`);
        });
        break;
      }
      case 'moveCheer': {
        const from = resolveTargets(a.from || a.target, ctx);
        const to = resolveTargets(a.to || 'self', ctx);
        if (from.length && to.length && from[0].cheer.length) {
          const col = from[0].cheer.pop();
          to[0].cheer.push(col);
          game.push('', `${me.name}: エールを${from[0].card.nm}→${to[0].card.nm}に付け替え`);
        }
        break;
      }
      case 'powerDown': {
        const targets = resolveTargets(a.target, ctx);
        targets.forEach((h) => { h.buffArt = (h.buffArt || 0) - (a.amount || 0); });
        break;
      }
      case 'search': {
        const n = Math.min(a.n || 1, me.deck.length);
        const match = me.deck.filter((c) => matchesFilter(c, a.filter));
        const take = match.slice(0, n);
        take.forEach((c) => { me.hand.push(c); me.deck.splice(me.deck.indexOf(c), 1); });
        if (take.length) { shuffle(me.deck, rnd); game.push('', `${me.name}: デッキから${take.length}枚サーチ`); }
        break;
      }
      default: break;
    }
  }
  function archiveHolo(game, p, holo) {
    if (p.center === holo) p.center = null;
    if (p.collab === holo) p.collab = null;
    const bi = p.back.indexOf(holo); if (bi >= 0) p.back.splice(bi, 1);
    p.archive.push(holo.card);
  }

  function abilityKey(cardN, part) { return cardN + ':' + part; }
  function canUse(p, key, once) {
    if (!once) return true;
    if (once === 'turn') return !p.usedTurn.has(key);
    if (once === 'game') return !p.usedGame.has(key);
    return true;
  }
  function markUsed(p, key, once) {
    if (once === 'turn') p.usedTurn.add(key);
    if (once === 'game') p.usedGame.add(key);
  }
  function tryRunAbility(game, me, op, ability, key, self, rnd) {
    if (!ability) return false;
    if (!canUse(me, key, ability.once)) return false;
    const ctx = { game, me, op, self, rnd };
    if (!checkCondition(ability.condition, ctx)) return false;
    markUsed(me, key, ability.once);
    runActions(ability.do, ctx);
    return true;
  }

  /* --- Interactive (generator) versions for search/reveal player choice --- */
  function* runActionsInteractive(actions, ctx) {
    if (!actions) return;
    for (const a of actions) yield* runActionInteractive(a, ctx);
  }
  function* runActionInteractive(a, ctx) {
    const { game, me, op, rnd } = ctx;
    switch (a.op) {
      case 'search': {
        const n = Math.min(a.n || 1, me.deck.length);
        const match = me.deck.filter((c) => matchesFilter(c, a.filter));
        if (!match.length) break;
        if (n === 1 && match.length === 1) {
          // Only one option — auto-select
          me.hand.push(match[0]); me.deck.splice(me.deck.indexOf(match[0]), 1);
          shuffle(me.deck, rnd);
          game.push('', `${me.name}: デッキから${match[0].nm}をサーチ`);
        } else {
          // Yield decision for player to pick. Collapse duplicate card numbers so the
          // picker shows one entry per distinct card (with a count) instead of 20 copies.
          const seenNums = new Set();
          const candidates = [];
          match.forEach((c) => {
            if (seenNums.has(c.n)) return;
            seenNums.add(c.n);
            candidates.push({ idx: candidates.length, card: c, dup: match.filter((x) => x.n === c.n).length });
          });
          const picks = [];
          for (let i = 0; i < n && candidates.length; i++) {
            const remaining = candidates.filter((c) => !picks.includes(c.idx));
            if (!remaining.length) break;
            const choice = yield { type: 'deckSearch', player: me === game.A ? 'A' : 'B', candidates: remaining.map((c) => ({ idx: c.idx, n: c.card.n, nm: c.card.nm, t: c.card.t, bl: c.card.bl, img: c.card.img, dup: c.dup })), count: n - i, prompt: `山札から${n - i}枚選択してください` };
            if (remaining.some((c) => c.idx === choice)) picks.push(choice);
            else picks.push(remaining[0].idx);
          }
          picks.forEach((pi) => {
            const c = candidates[pi].card;
            me.hand.push(c); me.deck.splice(me.deck.indexOf(c), 1);
          });
          if (picks.length) { shuffle(me.deck, rnd); game.push('', `${me.name}: デッキから${picks.length}枚サーチ`); }
        }
        break;
      }
      case 'reveal': {
        const n = Math.min(a.n, me.deck.length);
        const seen = me.deck.splice(0, n);
        const match = seen.filter((c) => matchesFilter(c, a.filter));
        if (match.length <= (a.keep || 1)) {
          // Auto-select all matching
          const take = match.slice(0, a.keep || 1);
          take.forEach((c) => me.hand.push(c));
          const rest = seen.filter((c) => !take.includes(c));
          me.deck = rest.concat(me.deck);
          if (take.length) game.push('', `${me.name}: 効果でカードを${take.length}枚手札に加えた`);
        } else {
          // Let player choose which to keep. idx stays an index into `match`; duplicate
          // card numbers are collapsed to one entry so the picker stays readable.
          const seenNums = new Set();
          const candidates = [];
          match.forEach((c, i) => {
            if (seenNums.has(c.n)) return;
            seenNums.add(c.n);
            candidates.push({ idx: i, n: c.n, nm: c.nm, t: c.t, bl: c.bl, img: c.img, dup: match.filter((x) => x.n === c.n).length });
          });
          const picks = [];
          const keep = a.keep || 1;
          for (let i = 0; i < keep && candidates.length; i++) {
            const remaining = candidates.filter((c) => !picks.includes(c.idx));
            if (!remaining.length) break;
            const choice = yield { type: 'revealChoice', player: me === game.A ? 'A' : 'B', candidates: remaining, count: keep - i, prompt: `公開されたカードから${keep - i}枚選択` };
            if (remaining.some((c) => c.idx === choice)) picks.push(choice);
            else picks.push(remaining[0].idx);
          }
          const take = picks.map((pi) => match[pi]);
          take.forEach((c) => me.hand.push(c));
          const rest = seen.filter((c) => !take.includes(c));
          me.deck = rest.concat(me.deck);
          if (take.length) game.push('', `${me.name}: 効果でカードを${take.length}枚手札に加えた`);
        }
        break;
      }
      default:
        // For all other ops, delegate to the non-interactive version
        runAction(a, ctx);
        break;
    }
  }
  function* tryRunAbilityInteractive(game, me, op, ability, key, self, rnd) {
    if (!ability) return false;
    if (!canUse(me, key, ability.once)) return false;
    const ctx = { game, me, op, self, rnd };
    if (!checkCondition(ability.condition, ctx)) return false;
    markUsed(me, key, ability.once);
    yield* runActionsInteractive(ability.do, ctx);
    return true;
  }

  /* ---------- game ---------- */
  function Game(deckA, deckB, DB, opts) {
    opts = opts || {};
    this.DB = DB;
    // 各プレイヤー専用の乱数ストリームを持たせる（共有ストリームだと消費順序に
    // 由来する統計的な偏り＝先攻/後攻のスロット差が生じるため、独立させる）
    const baseSeed = (opts.seed == null ? (Math.random() * 1e9) | 0 : opts.seed);
    this.rndA = mulberry32(baseSeed ^ 0x9E3779B1);
    this.rndB = mulberry32(baseSeed ^ 0x517CC1B7);
    this.rndSys = mulberry32(baseSeed ^ 0x2545F491);
    this.log = [];
    this.doLog = !!opts.log;
    this.effectsOn = opts.effects !== false; // Phase 2 effects default ON
    this.A = newPlayer(deckA, DB, this.rndA, opts.nameA || deckA.name || 'A');
    this.B = newPlayer(deckB, DB, this.rndB, opts.nameB || deckB.name || 'B');
    this.first = this.rndSys() < 0.5 ? 'A' : 'B';
    this.turn = 0;
  }
  Game.prototype.rndFor = function (p) { return p === this.A ? this.rndA : this.rndB; };
  Game.prototype.push = function (cls, t) { if (this.doLog) this.log.push({ cls, t }); };

  Game.prototype.holosOnStage = function (p) { const a = []; if (p.center) a.push(p.center); if (p.collab) a.push(p.collab); return a.concat(p.back); };
  Game.prototype.allHolos = function (p) { return this.holosOnStage(p); };

  Game.prototype.draw = function (p, n) {
    for (let i = 0; i < n; i++) { if (!p.deck.length) { p.lost = true; p.lostReason = 'デッキ切れ'; return; } p.hand.push(p.deck.shift()); }
  };
  Game.prototype.downCenter = function (op, me) {
    const downed = op.center;
    // onDowned trigger before archiving (card + attachments)
    if (this.effectsOn) {
      const fx = fxOf(this.DB, downed.card.n);
      if (fx && fx.keywords) {
        fx.keywords.filter((k) => k.trigger === 'onDowned').forEach((k, i) => {
          tryRunAbility(this, op, me, k, abilityKey(downed.card.n, 'kwDown' + i), downed, this.rndFor(op));
        });
      }
      if (downed.attachments) {
        downed.attachments.forEach((att) => {
          const afx = fxOf(this.DB, att.n);
          if (afx && afx.keywords) {
            afx.keywords.filter((k) => k.trigger === 'onDowned').forEach((k, i) => {
              tryRunAbility(this, op, me, k, abilityKey(att.n, 'attDown' + i), downed, this.rndFor(op));
            });
          }
        });
      }
    }
    op.archive.push(downed.card);
    downed.cheer.forEach((c) => op.archive.push({ t: 'cheer', c: [c] }));
    op.center = null;
    if (op.lifeCards && op.lifeCards.length > 0) {
      const lifeCheer = op.lifeCards.pop();
      op.life = op.lifeCards.length;
      const col = (lifeCheer.c && lifeCheer.c[0]) || '無';
      this.push('ko', `　⤷ ${op.name} のホロメンがダウン！ ライフ -1（残り${op.life}）`);
      // Attach life cheer to a holomen on the field
      const candidates = this.allHolos(op);
      if (candidates.length) {
        let target = candidates[0];
        for (const h of candidates) {
          const arts = this.DB.get(h.card.n).arts;
          if (arts.length && !canPay(effCost(arts[arts.length - 1], h), h.cheer)) { target = h; break; }
        }
        target.cheer.push(col);
        this.push('', `　${op.name}: ライフから${target.card.nm} に ${col}エール`);
      }
    } else {
      op.life = 0;
      op.lost = true; op.lostReason = 'ライフ0でダウン';
      this.push('ko', `　⤷ ${op.name} のホロメンがダウン！ ライフ0 → 敗北`);
      return;
    }
    if (op.back.length) {
      const promote = op.back.sort((a, b) => topArtPower(b.card, this.DB) - topArtPower(a.card, this.DB))[0];
      op.back.splice(op.back.indexOf(promote), 1); op.center = promote;
      this.push('', `　${op.name}: ${promote.card.nm} がセンターへ`);
    } else if (op.collab) {
      op.center = op.collab; op.collab = null;
    } else {
      op.lost = true; op.lostReason = 'ホロメン全滅';
    }
  };

  Game.prototype.setup = function () {
    for (const p of [this.A, this.B]) {
      const rnd = this.rndFor(p);
      let tries = 0;
      do {
        p.hand.forEach((c) => p.deck.push(c)); p.hand = [];
        if (tries > 0) shuffle(p.deck, rnd);
        this.draw(p, 7); tries++;
      } while (tries < 4 && !p.hand.some((c) => c.t === 'holomen' && c.bl === 'Debut'));

      const debuts = p.hand.filter((c) => c.t === 'holomen' && c.bl === 'Debut')
        .sort((a, b) => topArtPower(b, this.DB) - topArtPower(a, this.DB) || (b.hp || 0) - (a.hp || 0));
      if (!debuts.length) { p.lost = true; p.lostReason = 'Debut不在'; continue; }
      const center = debuts[0];
      p.center = makeHolo(center); p.center.playedTurn = 0;
      p.hand.splice(p.hand.indexOf(center), 1);
      for (let i = 1; i < debuts.length && p.back.length < 3; i++) {
        const c = debuts[i]; p.back.push(Object.assign(makeHolo(c), { playedTurn: 0 })); p.hand.splice(p.hand.indexOf(c), 1);
      }
      p.lifeCards = p.cheerDeck.splice(0, p.life);
    }
    this.push('', `先攻: ${this[this.first].name}`);
  };

  Game.prototype.attachCheer = function (p, turnNo) {
    if (!p.cheerDeck.length) return;
    const cheer = p.cheerDeck.shift();
    const col = (cheer.c && cheer.c[0]) || '無';
    const candidates = [p.center, p.collab, ...p.back].filter(Boolean);
    if (!candidates.length) return;
    let target = null, bestScore = -1;
    for (const h of candidates) {
      const arts = this.DB.get(h.card.n).arts;
      if (!arts.length) continue;
      const top = arts.reduce((best, a) => (a.power > (best ? best.power : -1) ? a : best), null);
      if (!top) continue;
      let score = 0;
      if (!canPay(effCost(top, h), h.cheer)) {
        score += 100; // needs cheer to attack
        const needs = effCost(top, h).colors;
        if (needs[col]) score += 50; // color match bonus
      }
      if (h === p.center) score += 10; // prefer center
      if (score > bestScore) { bestScore = score; target = h; }
    }
    if (!target) target = p.center || candidates[0];
    target.cheer.push(col);
    this.push('', `${p.name}: ${target.card.nm} に ${col}エール`);
  };

  // ---- Phase 2: oshi skill / SP oshi skill (manual, AI-triggered) ----
  Game.prototype.tryOshiSkills = function (p, op) {
    if (!this.effectsOn) return;
    const fx = fxOf(this.DB, p.oshiCard.n);
    if (!fx) return;
    const rnd = this.rndFor(p);
    const payHolopower = (n) => {
      if (!n) return true;
      if (p.deck.length <= n + 5) return false;
      for (let i = 0; i < n; i++) p.holoPower.push(p.deck.shift());
      return true;
    };
    // AI: evaluate whether to use oshi skill based on cost/benefit
    const shouldUseOshi = (skill) => {
      const cost = (skill.cost && skill.cost.holopower) || 0;
      if (cost >= 5 && p.deck.length < 20) return false;
      if (cost >= 3 && p.deck.length < 12) return false;
      const ops = skill.do || [];
      const hasBuff = ops.some((a) => a.op === 'buffArt');
      if (hasBuff && !p.center) return false;
      return true;
    };
    // AI: SP is game-once — save for impactful moments
    const shouldUseSP = (skill) => {
      const cost = (skill.cost && skill.cost.holopower) || 0;
      if (p.deck.length <= cost + 8) return false;
      const ops = skill.do || [];
      const hasDamage = ops.some((a) => a.op === 'specialDamage');
      if (hasDamage && op.center) {
        const opHp = (op.center.card.hp || 0) - op.center.dmg;
        const dmg = ops.filter((a) => a.op === 'specialDamage').reduce((s, a) => s + (a.amount || 0), 0);
        if (opHp > dmg * 2) return false; // save if enemy is too healthy
      }
      const hasBuff = ops.some((a) => a.op === 'buffArt');
      if (hasBuff && !p.center) return false;
      if (hasBuff && p.center) {
        const art = bestArt(p.center, this.DB);
        if (!art) return false; // no art to buff
      }
      if (this.turn < 4 && cost >= 3) return false; // save expensive SP for later
      return true;
    };
    if (fx.oshi && canUse(p, abilityKey(p.oshiCard.n, 'oshi'), 'turn') && shouldUseOshi(fx.oshi)) {
      const cost = (fx.oshi.cost && fx.oshi.cost.holopower) || 0;
      if (payHolopower(cost)) {
        const used = tryRunAbility(this, p, op, fx.oshi, abilityKey(p.oshiCard.n, 'oshi'), p.center, rnd);
        if (used) this.push('', `${p.name}: 推しスキル「${fx.oshi.name || ''}」`);
      }
    }
    if (fx.sp && canUse(p, abilityKey(p.oshiCard.n, 'sp'), 'game') && shouldUseSP(fx.sp)) {
      const cost = (fx.sp.cost && fx.sp.cost.holopower) || 0;
      if (payHolopower(cost)) {
        const used = tryRunAbility(this, p, op, fx.sp, abilityKey(p.oshiCard.n, 'sp'), p.center, rnd);
        if (used) this.push('', `${p.name}: SP推しスキル「${fx.sp.name || ''}」`);
      }
    }
  };

  // ---- Phase 2: play support cards from hand ----
  Game.prototype.playSupportCards = function (p, op, turnNo, opts) {
    if (!this.effectsOn) return;
    const rnd = this.rndFor(p);
    const noLimited = opts && opts.noLimited;
    // Sort supports: draw/reveal first, then buffs, then others
    const supPriority = (c) => {
      const fx = fxOf(this.DB, c.n);
      if (!fx || !fx.ability || !fx.ability.do) return 50;
      const ops = fx.ability.do.map((a) => a.op);
      if (ops.includes('draw') || ops.includes('reveal') || ops.includes('search')) return 10;
      if (ops.includes('buffArt') || ops.includes('attachCheer')) return 20;
      return 40;
    };
    const sups = p.hand.filter((c) => c.t === 'support').sort((a, b) => supPriority(a) - supPriority(b));
    const nonSups = p.hand.filter((c) => c.t !== 'support');
    p.hand = nonSups.concat(sups);
    let guard = 0;
    while (guard++ < 8) {
      const idx = p.hand.findIndex((c) => c.t === 'support');
      if (idx < 0) break;
      const card = p.hand[idx];
      const fx = fxOf(this.DB, card.n);
      const isLimited = !!(card.ltd);
      if (isLimited && (p.limitedUsedTurn || noLimited)) { break; }
      const isAttach = (card.st === 'ツール' || card.st === 'マスコット' || card.st === 'ファン');
      if (!isAttach && (!fx || !fx.ability)) { p.hand.splice(idx, 1); p.hand.push(card); if (p.hand.length === 1) break; continue; }
      const key = abilityKey(card.n, 'sup');
      if (fx && fx.ability) {
        if (!canUse(p, key, fx.ability.once || 'turn')) { p.hand.splice(idx, 1); p.hand.push(card); if (p.hand.length === 1) break; continue; }
        const ctx = { game: this, me: p, op, self: p.center, rnd };
        if (!checkCondition(fx.ability.condition, ctx)) { p.hand.splice(idx, 1); p.hand.push(card); if (p.hand.length === 1) break; continue; }
      }
      // Tool/Mascot/Fan: attach to holomen
      if (isAttach) {
        const attachFilter = fx && fx.attachFilter;
        const targets = this.allHolos(p).filter((h) => !attachFilter || matchesFilter(h.card, attachFilter));
        const host = pickTopAttacker(targets.filter((h) => !(card.st !== 'ファン' && h.attachments.some((a2) => a2.st === card.st))), this.DB);
        if (!host) { p.hand.splice(idx, 1); p.hand.push(card); if (p.hand.length === 1) break; continue; }
        host.attachments.push(card);
        p.hand.splice(idx, 1);
        if (fx && fx.ability) markUsed(p, key, 'game');
        this.push('', `${p.name}: ${host.card.nm} に〈${card.nm}〉を付けた`);
      } else {
        const ctx = { game: this, me: p, op, self: p.center, rnd };
        p.hand.splice(idx, 1);
        markUsed(p, key, fx.ability.once || 'turn');
        if (isLimited) p.limitedUsedTurn = true;
        runActions(fx.ability.do, ctx);
        p.archive.push(card);
        this.push('', `${p.name}: 〈${card.nm}〉を使用`);
      }
    }
  };

  Game.prototype.applyAttachmentStatics = function (holo) {
    let hp = holo.card.hp || 0, artBonus = 0, costReduce = 0;
    holo.attachments.forEach((att) => {
      const fx = fxOf(this.DB, att.n);
      if (!fx || !fx.static) return;
      fx.static.forEach((s) => {
        if (s.mod === 'hp') hp += s.amount;
        if (s.mod === 'artPower') artBonus += s.amount;
        if (s.mod === 'artCost') costReduce += s.amount;
      });
    });
    return { hp, artBonus, costReduce };
  };

  Game.prototype.mainPhase = function (p, turnNo, op, opts) {
    const noBloom = opts && opts.noBloom;
    const noLimited = opts && opts.noLimited;
    const tryBloom = (holo) => {
      if (noBloom) return; // Both players cannot bloom on their first turn
      if (!holo || holo.playedTurn === turnNo) return;
      const next = holo.card.bl === 'Debut' ? '1st' : holo.card.bl === '1st' ? '2nd' : null;
      if (!next) return;
      const idx = p.hand.findIndex((c) => c.t === 'holomen' && c.nm === holo.card.nm && c.bl === next);
      if (idx < 0) return;
      const prevCard = holo.card;
      const bl = p.hand.splice(idx, 1)[0];
      holo.card = bl; holo.bloomedTurn = turnNo;
      this.push('', `${p.name}: ${bl.nm} に ブルーム(${next})`);
      if (this.effectsOn) {
        // Gift trigger: check if the previous (material) card had Gift
        const prevFx = fxOf(this.DB, prevCard.n);
        if (prevFx && prevFx.keywords) {
          prevFx.keywords.filter((k) => k.trigger === 'onGift').forEach((k, i) => {
            tryRunAbility(this, p, op, k, abilityKey(prevCard.n, 'gift' + i), holo, this.rndFor(p));
            this.push('', `${p.name}: ${prevCard.nm} のギフト効果`);
          });
        }
        // onBloom trigger on the new card
        const fx = fxOf(this.DB, bl.n);
        if (fx && fx.keywords) {
          fx.keywords.filter((k) => k.trigger === 'onBloom').forEach((k, i) => {
            tryRunAbility(this, p, op, k, abilityKey(bl.n, 'kwB' + i), holo, this.rndFor(p));
          });
        }
        // onBloom triggers from attachments
        if (holo.attachments) {
          holo.attachments.forEach((att) => {
            const afx = fxOf(this.DB, att.n);
            if (afx && afx.keywords) {
              afx.keywords.filter((k) => k.trigger === 'onBloom').forEach((k, i) => {
                tryRunAbility(this, p, op, k, abilityKey(att.n, 'attB' + i), holo, this.rndFor(p));
              });
            }
          });
        }
      }
    };
    tryBloom(p.center); tryBloom(p.collab); p.back.forEach(tryBloom);

    while (p.back.length + (p.collab ? 1 : 0) < 5) {
      const idx = p.hand.findIndex((c) => c.t === 'holomen' && c.bl === 'Debut');
      if (idx < 0) break;
      const c = p.hand.splice(idx, 1)[0];
      p.back.push(Object.assign(makeHolo(c), { playedTurn: turnNo }));
      this.push('', `${p.name}: ${c.nm} をバックに出す`);
      if (p.back.length >= 3) break;
    }

    if (this.effectsOn) this.playSupportCards(p, op, turnNo, { noLimited: noLimited });

    if (!p.collab && !p.usedCollab && p.back.length) {
      const collabScore = (h) => {
        let s = topArtPower(h.card, this.DB);
        if (this.effectsOn) {
          const fx = fxOf(this.DB, h.card.n);
          if (fx && fx.keywords && fx.keywords.some((k) => k.trigger === 'onCollab')) s += 30;
        }
        return s;
      };
      const cand = p.back.filter((h) => !h.rested && h.playedTurn !== turnNo)
        .sort((a, b) => collabScore(b) - collabScore(a))[0];
      if (cand && (topArtPower(cand.card, this.DB) > 0 || collabScore(cand) > 0)) {
        p.back.splice(p.back.indexOf(cand), 1); p.collab = cand; p.usedCollab = true;
        // Collab rule: move top card of deck to holoPower
        if (p.deck.length) p.holoPower.push(p.deck.shift());
        this.push('', `${p.name}: ${cand.card.nm} をコラボ（ホロパワー+1）`);
        if (this.effectsOn) {
          const fx = fxOf(this.DB, cand.card.n);
          if (fx && fx.keywords) {
            fx.keywords.filter((k) => k.trigger === 'onCollab').forEach((k, i) => {
              tryRunAbility(this, p, op, k, abilityKey(cand.card.n, 'kwC' + i), cand, this.rndFor(p));
            });
          }
        }
      }
    }

    if (this.effectsOn) this.tryOshiSkills(p, op);

    const centerArt = p.center ? bestArt(p.center, this.DB) : null;
    const shouldBaton = (center) => {
      if (!center) return false;
      const need = this.DB.get(center.card.n).baton;
      if (center.cheer.length < need || !p.back.length) return false;
      if (!centerArt) return true; // can't attack → baton
      // baton if center is near death and a healthier replacement exists
      const hp = (center.card.hp || 0);
      const remaining = hp - center.dmg;
      if (remaining <= hp * 0.3 && remaining > 0) {
        const better = p.back.find((h) => !h.rested && h.dmg < (h.card.hp || 0) * 0.5 && topArtPower(h.card, this.DB) >= topArtPower(center.card, this.DB) * 0.7);
        if (better) return true;
      }
      return false;
    };
    if (p.center && shouldBaton(p.center)) {
      const need = this.DB.get(p.center.card.n).baton;
      const better = p.back.filter((h) => !h.rested).sort((a, b) => topArtPower(b.card, this.DB) - topArtPower(a.card, this.DB))[0];
      if (better && (topArtPower(better.card, this.DB) > 0 || !centerArt)) {
        for (let i = 0; i < need; i++) p.archive.push({ t: 'cheer', c: [p.center.cheer.pop()] });
        p.back.splice(p.back.indexOf(better), 1);
        const old = p.center; p.center = better; p.back.push(old);
        this.push('', `${p.name}: バトンタッチ → ${better.card.nm} がセンター`);
      }
    }
  };

  Game.prototype.performArt = function (attacker, me, op, turnNo) {
    const art = bestArt(attacker, this.DB);
    if (!art) return;
    if (!op.center) return;
    const attStatic = this.effectsOn ? this.applyAttachmentStatics(attacker) : { artBonus: 0 };
    const dmg = art.power + attStatic.artBonus;
    op.center.dmg += dmg;
    const cls = me === this.A ? 'ta' : 'tb';
    this.push(cls, `T${turnNo} ${me.name}: ${attacker.card.nm} → ${op.center.card.nm} に ${dmg}`);

    if (this.effectsOn) {
      const fx = fxOf(this.DB, attacker.card.n);
      if (fx && fx.arts && fx.arts[art.idx]) {
        tryRunAbility(this, me, op, fx.arts[art.idx], abilityKey(attacker.card.n, 'art' + art.idx), attacker, this.rndFor(me));
      }
      if (op.center) {
        const defFx = fxOf(this.DB, op.center.card.n);
        if (defFx && defFx.keywords) {
          defFx.keywords.filter((k) => k.trigger === 'onDamageTaken').forEach((k, i) => {
            if (op.center) tryRunAbility(this, op, me, k, abilityKey(op.center.card.n, 'kwD' + i), op.center, this.rndFor(op));
          });
        }
      }
    }

    if (op.center && op.center.dmg >= ((op.center.card.hp || 0) + (this.effectsOn ? this.applyAttachmentStatics(op.center).hp - (op.center.card.hp || 0) : 0))) {
      this.downCenter(op, me);
    }
  };

  Game.prototype.takeTurn = function (who) {
    const me = this[who], op = who === 'A' ? this.B : this.A;
    if (me.lost || op.lost) return;
    this.turn++;
    const turnNo = this.turn;
    const isFirstPlayer = (who === this.first);
    const isMyFirstTurn = !me._hadTurn; // first turn for this player
    me._hadTurn = true;
    const isFirstPlayerFirstTurn = isMyFirstTurn && isFirstPlayer;
    const isAnyFirstTurn = isMyFirstTurn;
    // Reset step: skipped on both players' first turn (official rules)
    if (!isAnyFirstTurn) {
      if (me.collab) { me.back.push(me.collab); me.collab = null; }
      this.allHolos(me).forEach((h) => { h.rested = false; h.buffArt = 0; h.costReduce = 0; });
    }
    me.usedCollab = false; me.usedTurn.clear(); me.limitedUsedTurn = false;
    this.draw(me, 1);
    if (me.lost) return;
    this.attachCheer(me, turnNo);
    this.mainPhase(me, turnNo, op, { noBloom: isAnyFirstTurn, noLimited: isFirstPlayerFirstTurn });
    // Performance step: skipped on first player's first turn only
    if (!isFirstPlayerFirstTurn) {
      if (me.center) this.performArt(me.center, me, op, turnNo);
      if (op.lost) return;
      if (me.collab) this.performArt(me.collab, me, op, turnNo);
    }
    if (me.collab) me.collab.rested = true;
  };

  Game.prototype.play = function (maxTurns) {
    this.setup();
    if (this.A.lost && this.B.lost) return this.finish(this.rndSys() < 0.5 ? 'A' : 'B');
    if (this.A.lost) return this.finish('B');
    if (this.B.lost) return this.finish('A');
    const order = this.first === 'A' ? ['A', 'B'] : ['B', 'A'];
    let idx = 0;
    while (this.turn < (maxTurns || 60)) {
      const who = order[idx % 2];
      this.takeTurn(who);
      const other = who === 'A' ? 'B' : 'A';
      if (this[other].lost) return this.finish(who);
      if (this[who].lost) return this.finish(other);
      idx++;
    }
    let w;
    if (this.A.life > this.B.life) w = 'A';
    else if (this.B.life > this.A.life) w = 'B';
    else w = this.rndSys() < 0.5 ? 'A' : 'B';
    this.push('', '規定ターン到達：ライフ優勢で判定');
    return this.finish(w, true);
  };
  Game.prototype.finish = function (winner, timeout) {
    const wName = this[winner].name;
    this.push(winner === 'A' ? 'ta' : 'tb', `★ ${wName} の勝ち（${this.turn}ターン${timeout ? '・時間切れ' : ''}）`);
    return { winner, turns: this.turn, log: this.log, reason: this[winner === 'A' ? 'B' : 'A'].lostReason };
  };

  /* ================= Interactive (generator-based) game loop ================= */

  /* --- AI decision helpers (extracted from inline heuristics) --- */
  function aiPickCheerTarget(candidates, cheerColor, game) {
    let target = null, bestScore = -1;
    for (const h of candidates) {
      const arts = game.DB.get(h.card.n).arts;
      if (!arts.length) continue;
      const top = arts.reduce((best, a) => (a.power > (best ? best.power : -1) ? a : best), null);
      if (!top) continue;
      let score = 0;
      if (!canPay(effCost(top, h), h.cheer)) {
        score += 100;
        const needs = effCost(top, h).colors;
        if (needs[cheerColor]) score += 50;
      }
      if (game.allHolos(game.A).includes(h) ? h === game.A.center : h === game.B.center) score += 10;
      if (score > bestScore) { bestScore = score; target = h; }
    }
    return target || candidates[0];
  }

  function aiPickLifeCheerTarget(candidates, game) {
    for (const h of candidates) {
      const arts = game.DB.get(h.card.n).arts;
      if (arts.length && !canPay(effCost(arts[arts.length - 1], h), h.cheer)) return h;
    }
    return candidates[0];
  }

  function aiPickSetupCenter(debuts, game) {
    return debuts.sort((a, b) => topArtPower(b, game.DB) - topArtPower(a, game.DB) || (b.hp || 0) - (a.hp || 0))[0];
  }

  function aiPickSetupBack(debuts, game) {
    return debuts.sort((a, b) => topArtPower(b, game.DB) - topArtPower(a, game.DB) || (b.hp || 0) - (a.hp || 0)).slice(0, 3);
  }

  function aiPickPromoteCenter(backHolos, game) {
    return backHolos.sort((a, b) => topArtPower(b.card, game.DB) - topArtPower(a.card, game.DB))[0];
  }

  function aiGetMainActions(p, op, turnNo, game, opts) {
    const actions = [];
    const allH = game.allHolos(p);
    const noBloom = opts && opts.noBloom;
    const noLimited = opts && opts.noLimited;
    // Bloom options (blocked on both players' first turn)
    if (!noBloom) {
      for (const holo of allH) {
        if (!holo || holo.playedTurn === turnNo) continue;
        const next = holo.card.bl === 'Debut' ? '1st' : holo.card.bl === '1st' ? '2nd' : null;
        if (!next) continue;
        const idx = p.hand.findIndex((c) => c.t === 'holomen' && c.nm === holo.card.nm && c.bl === next);
        if (idx >= 0) actions.push({ act: 'bloom', holoId: holo.id, handIdx: idx, label: `ブルーム: ${holo.card.nm} → ${next}` });
      }
    }
    // Place Debut
    if (p.back.length + (p.collab ? 1 : 0) < 5) {
      p.hand.forEach((c, i) => {
        if (c.t === 'holomen' && c.bl === 'Debut') {
          actions.push({ act: 'placeDebut', handIdx: i, label: `ステージに出す: ${c.nm}` });
        }
      });
    }
    // Support cards (LIMITED blocked on first player's first turn)
    if (game.effectsOn) {
      p.hand.forEach((c, i) => {
        if (c.t !== 'support') return;
        const fx = fxOf(game.DB, c.n);
        const isLimited = !!(c.ltd);
        if (isLimited && (p.limitedUsedTurn || noLimited)) return;
        const isAttach = (c.st === 'ツール' || c.st === 'マスコット' || c.st === 'ファン');
        // Attach-type supports can be played even without ability (they just attach with static effects)
        if (!isAttach && (!fx || !fx.ability)) return;
        if (fx && fx.ability) {
          const key = abilityKey(c.n, 'sup');
          if (!canUse(p, key, fx.ability.once || 'turn')) return;
        }
        actions.push({ act: 'playSupport', handIdx: i, label: `サポート使用: ${c.nm}` });
      });
    }
    // Collab
    if (!p.collab && !p.usedCollab) {
      p.back.filter((h) => !h.rested && h.playedTurn !== turnNo).forEach((h) => {
        actions.push({ act: 'collab', holoId: h.id, label: `コラボ: ${h.card.nm}` });
      });
    }
    // Oshi skill
    if (game.effectsOn) {
      const fx = fxOf(game.DB, p.oshiCard.n);
      if (fx && fx.oshi && canUse(p, abilityKey(p.oshiCard.n, 'oshi'), 'turn') && p.deck.length > ((fx.oshi.cost && fx.oshi.cost.holopower) || 0) + 5) {
        actions.push({ act: 'oshiSkill', label: `推しスキル: ${fx.oshi.name || ''}`, cost: (fx.oshi.cost && fx.oshi.cost.holopower) || 0 });
      }
      if (fx && fx.sp && canUse(p, abilityKey(p.oshiCard.n, 'sp'), 'game') && p.deck.length > ((fx.sp.cost && fx.sp.cost.holopower) || 0) + 5) {
