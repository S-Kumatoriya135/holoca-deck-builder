        actions.push({ act: 'spSkill', label: `SP推しスキル: ${fx.sp.name || ''}`, cost: (fx.sp.cost && fx.sp.cost.holopower) || 0 });
      }
    }
    // Baton touch
    if (p.center && p.back.length) {
      const need = game.DB.get(p.center.card.n).baton;
      if (p.center.cheer.length >= need) {
        p.back.filter((h) => !h.rested).forEach((h) => {
          actions.push({ act: 'baton', holoId: h.id, label: `バトンタッチ: → ${h.card.nm}`, cost: need });
        });
      }
    }
    return actions;
  }

  function aiPickMainAction(actions, p, op, game) {
    // Priority: bloom > place debut (up to 3) > support > collab > oshi > baton > end
    const priority = { bloom: 1, placeDebut: 2, playSupport: 3, collab: 4, oshiSkill: 5, spSkill: 6, baton: 7 };
    const sorted = actions.filter((a) => a.act !== 'endMain').sort((a, b) => (priority[a.act] || 99) - (priority[b.act] || 99));
    if (!sorted.length) return { act: 'endMain' };

    const pick = sorted[0];
    // Limit debut placement to 3 back
    if (pick.act === 'placeDebut' && p.back.length >= 3) {
      const nonDebut = sorted.filter((a) => a.act !== 'placeDebut');
      return nonDebut.length ? nonDebut[0] : { act: 'endMain' };
    }
    // Baton touch: only if center can't attack or is near death
    if (pick.act === 'baton') {
      const art = bestArt(p.center, game.DB);
      const hp = (p.center.card.hp || 0);
      const remaining = hp - p.center.dmg;
      if (art && remaining > hp * 0.3) return { act: 'endMain' };
    }
    // SP skill: save for later turns
    if (pick.act === 'spSkill') {
      const fx = fxOf(game.DB, p.oshiCard.n);
      if (fx && fx.sp) {
        const cost = (fx.sp.cost && fx.sp.cost.holopower) || 0;
        if (p.deck.length <= cost + 8) return { act: 'endMain' };
        if (game.turn < 4 && cost >= 3) {
          const nonSP = sorted.filter((a) => a.act !== 'spSkill');
          return nonSP.length ? nonSP[0] : { act: 'endMain' };
        }
      }
    }
    // Oshi skill: check AI heuristic
    if (pick.act === 'oshiSkill') {
      const fx = fxOf(game.DB, p.oshiCard.n);
      if (fx && fx.oshi) {
        const cost = (fx.oshi.cost && fx.oshi.cost.holopower) || 0;
        if (cost >= 3 && p.deck.length < 12) return { act: 'endMain' };
        const ops = fx.oshi.do || [];
        if (ops.some((a) => a.op === 'buffArt') && !p.center) {
          const nonOshi = sorted.filter((a) => a.act !== 'oshiSkill');
          return nonOshi.length ? nonOshi[0] : { act: 'endMain' };
        }
      }
    }
    return pick;
  }

  function aiPickArt(holo, game) {
    const art = bestArt(holo, game.DB);
    return art ? art.idx : -1;
  }

  /* --- aiResolve: given a decision object, return AI's choice --- */
  function aiResolve(decision, game) {
    const p = game[decision.player];
    const op = decision.player === 'A' ? game.B : game.A;
    switch (decision.type) {
      case 'mulligan': {
        const hand = decision.hand.map((n) => game.DB.get(n)).filter(Boolean);
        const hasDebut = hand.some((c) => c.t === 'holomen' && c.bl === 'Debut');
        const debutCount = hand.filter((c) => c.t === 'holomen' && c.bl === 'Debut').length;
        if (!hasDebut) return 'yes';
        if (debutCount <= 1 && hand.length >= 7) return 'yes';
        return 'no';
      }
      case 'setupCenter': return aiPickSetupCenter(decision.candidates, game).n;
      case 'setupBack': return aiPickSetupBack(decision.candidates, game).map((c) => c.n);
      case 'cheerTarget': return aiPickCheerTarget(decision.candidates, decision.cheerColor, game).id;
      case 'lifeCheerTarget': return aiPickLifeCheerTarget(decision.candidates, game).id;
      case 'promoteCenter': return aiPickPromoteCenter(decision.candidates, game).id;
      case 'mainAction': return aiPickMainAction(decision.actions, p, op, game);
      case 'artChoice': {
        const ai = aiPickArt(decision.holo, game);
        return ai >= 0 ? ai : (decision.arts.length ? decision.arts[decision.arts.length - 1].idx : 'skip');
      }
      case 'supportTarget': {
        const t = pickTopAttacker(decision.candidates, game.DB);
        return t ? t.id : decision.candidates[0].id;
      }
      case 'deckSearch': {
        // AI picks the first candidate
        return decision.candidates.length ? decision.candidates[0].idx : 0;
      }
      case 'revealChoice': {
        // AI picks the first candidate
        return decision.candidates.length ? decision.candidates[0].idx : 0;
      }
      default: return null;
    }
  }

  /* --- snapshot: serialize visible game state for UI rendering --- */
  function snapshot(game) {
    const snapHolo = (h) => h ? {
      id: h.id, n: h.card.n, nm: h.card.nm, hp: h.card.hp || 0, dmg: h.dmg,
      bl: h.card.bl, cheer: h.cheer.slice(), rested: h.rested,
      colors: h.card.c || [], tags: h.card.tg || [],
      buffArt: h.buffArt || 0, img: h.card.img,
      attachments: (h.attachments || []).map((a) => ({ n: a.n, nm: a.nm })),
    } : null;
    const snapP = (p, hideHand) => ({
      name: p.name, life: p.life, deckCount: p.deck.length,
      cheerDeckCount: p.cheerDeck.length, archiveCount: p.archive.length,
      holoPowerCount: p.holoPower.length,
      oshi: { n: p.oshiCard.n, nm: p.oshiCard.nm, lf: p.oshiCard.lf, img: p.oshiCard.img, c: p.oshiCard.c },
      center: snapHolo(p.center), collab: snapHolo(p.collab),
      back: p.back.map(snapHolo),
      hand: hideHand ? p.hand.length : p.hand.map((c) => ({ n: c.n, nm: c.nm, t: c.t, bl: c.bl, hp: c.hp, c: c.c, img: c.img, st: c.st, ltd: c.ltd })),
      lost: p.lost, lostReason: p.lostReason,
    });
    return {
      turn: game.turn, phase: game._phase || '',
      A: snapP(game.A, false), B: snapP(game.B, false),
      log: game.log.slice(-50),
    };
  }

  /* --- Interactive game loop (generator) --- */
  Game.prototype.setupInteractive = function* () {
    for (const p of [this.A, this.B]) {
      const rnd = this.rndFor(p);
      let tries = 0;
      do {
        p.hand.forEach((c) => p.deck.push(c)); p.hand = [];
        if (tries > 0) shuffle(p.deck, rnd);
        this.draw(p, 7); tries++;
      } while (tries < 4 && !p.hand.some((c) => c.t === 'holomen' && c.bl === 'Debut'));

      const debuts = p.hand.filter((c) => c.t === 'holomen' && c.bl === 'Debut');
      if (!debuts.length) { p.lost = true; p.lostReason = 'Debut不在'; continue; }

      const who = p === this.A ? 'A' : 'B';
      // Mulligan: ask player if they want to redraw (once)
      const mulliganChoice = yield { type: 'mulligan', player: who, hand: p.hand.map((c) => c.n), prompt: '手札を引き直しますか？（1回のみ）' };
      if (mulliganChoice === 'yes') {
        p.hand.forEach((c) => p.deck.push(c)); p.hand = [];
        shuffle(p.deck, rnd);
        this.draw(p, 7);
        this.push(p.name, '手札を引き直しました');
      }

      const debuts2 = p.hand.filter((c) => c.t === 'holomen' && c.bl === 'Debut');
      if (!debuts2.length) { p.lost = true; p.lostReason = 'Debut不在(引き直し後)'; continue; }

      // Choose center
      const centerChoice = yield { type: 'setupCenter', player: who, candidates: debuts2, prompt: 'センターに出すDebutホロメンを選択' };
      const center = debuts2.find((c) => c.n === centerChoice) || debuts2[0];
      p.center = makeHolo(center); p.center.playedTurn = 0;
      p.hand.splice(p.hand.indexOf(center), 1);

      // Choose back stage (up to 3)
      const remainDebuts = p.hand.filter((c) => c.t === 'holomen' && c.bl === 'Debut');
      if (remainDebuts.length) {
        const backChoice = yield { type: 'setupBack', player: who, candidates: remainDebuts, prompt: 'バックステージに出すDebutホロメンを選択（最大3枚）' };
        const backNums = Array.isArray(backChoice) ? backChoice : [backChoice];
        for (const bn of backNums.slice(0, 3)) {
          const bc = p.hand.find((c) => c.n === bn && c.t === 'holomen' && c.bl === 'Debut');
          if (bc) { p.back.push(Object.assign(makeHolo(bc), { playedTurn: 0 })); p.hand.splice(p.hand.indexOf(bc), 1); }
        }
      }
      p.lifeCards = p.cheerDeck.splice(0, p.life);
    }
    this.push('', `先攻: ${this[this.first].name}`);
    yield { type: 'event', event: 'setupDone', msg: `先攻: ${this[this.first].name}` };
  };

  Game.prototype.attachCheerInteractive = function* (p) {
    if (!p.cheerDeck.length) return;
    const cheer = p.cheerDeck.shift();
    const col = (cheer.c && cheer.c[0]) || '無';
    const candidates = [p.center, p.collab, ...p.back].filter(Boolean);
    if (!candidates.length) return;
    const who = p === this.A ? 'A' : 'B';
    const choice = yield { type: 'cheerTarget', player: who, candidates, cheerColor: col, prompt: `${col}エールを付けるホロメンを選択` };
    const target = candidates.find((h) => h.id === choice) || candidates[0];
    target.cheer.push(col);
    this.push('', `${p.name}: ${target.card.nm} に ${col}エール`);
  };

  Game.prototype.downCenterInteractive = function* (op, me) {
    const downed = op.center;
    if (this.effectsOn) {
      const fx = fxOf(this.DB, downed.card.n);
      if (fx && fx.keywords) {
        fx.keywords.filter((k) => k.trigger === 'onDowned').forEach((k, i) => {
          tryRunAbility(this, op, me, k, abilityKey(downed.card.n, 'kwDown' + i), downed, this.rndFor(op));
        });
      }
      if (downed.attachments) {
        downed.attachments.forEach((att) => {
          const afx = fxOf(this.DB, att.n);
          if (afx && afx.keywords) {
            afx.keywords.filter((k) => k.trigger === 'onDowned').forEach((k, i) => {
              tryRunAbility(this, op, me, k, abilityKey(att.n, 'attDown' + i), downed, this.rndFor(op));
            });
          }
        });
      }
    }
    op.archive.push(downed.card);
    downed.cheer.forEach((c) => op.archive.push({ t: 'cheer', c: [c] }));
    op.center = null;
    const opWho = op === this.A ? 'A' : 'B';
    if (op.lifeCards && op.lifeCards.length > 0) {
      const lifeCheer = op.lifeCards.pop();
      op.life = op.lifeCards.length;
      const col = (lifeCheer.c && lifeCheer.c[0]) || '無';
      this.push('ko', `　⤷ ${op.name} のホロメンがダウン！ ライフ -1（残り${op.life}）`);
      yield { type: 'event', event: 'downed', msg: `${downed.card.nm} がダウン！` };
      const candidates = this.allHolos(op);
      if (candidates.length) {
        const lifeChoice = yield { type: 'lifeCheerTarget', player: opWho, candidates, cheerColor: col, prompt: `ライフから${col}エールを付けるホロメンを選択` };
        const target = candidates.find((h) => h.id === lifeChoice) || candidates[0];
        target.cheer.push(col);
        this.push('', `　${op.name}: ライフから${target.card.nm} に ${col}エール`);
      }
    } else {
      op.life = 0; op.lost = true; op.lostReason = 'ライフ0でダウン';
      this.push('ko', `　⤷ ${op.name} のホロメンがダウン！ ライフ0 → 敗北`);
      return;
    }
    if (op.back.length) {
      const promoteChoice = yield { type: 'promoteCenter', player: opWho, candidates: op.back, prompt: 'センターに出すホロメンを選択' };
      const promote = op.back.find((h) => h.id === promoteChoice) || op.back[0];
      op.back.splice(op.back.indexOf(promote), 1); op.center = promote;
      this.push('', `　${op.name}: ${promote.card.nm} がセンターへ`);
    } else if (op.collab) {
      op.center = op.collab; op.collab = null;
    } else {
      op.lost = true; op.lostReason = 'ホロメン全滅';
    }
  };

  Game.prototype.executeMainAction = function* (p, op, action) {
    const rnd = this.rndFor(p);
    const who = p === this.A ? 'A' : 'B';
    switch (action.act) {
      case 'bloom': {
        const holo = this.allHolos(p).find((h) => h.id === action.holoId);
        if (!holo) break;
        const bl = p.hand[action.handIdx];
        if (!bl) break;
        const prevCard = holo.card;
        p.hand.splice(action.handIdx, 1);
        holo.card = bl; holo.bloomedTurn = this.turn;
        this.push('', `${p.name}: ${bl.nm} に ブルーム(${bl.bl})`);
        yield { type: 'event', event: 'bloom', player: who, holoId: holo.id, name: bl.nm, level: bl.bl };
        if (this.effectsOn) {
          const prevFx = fxOf(this.DB, prevCard.n);
          if (prevFx && prevFx.keywords) {
            const giftKws = prevFx.keywords.filter((k) => k.trigger === 'onGift');
            for (let i = 0; i < giftKws.length; i++) {
              yield* tryRunAbilityInteractive(this, p, op, giftKws[i], abilityKey(prevCard.n, 'gift' + i), holo, rnd);
              this.push('', `${p.name}: ${prevCard.nm} のギフト効果`);
            }
          }
          const fx = fxOf(this.DB, bl.n);
          if (fx && fx.keywords) {
            const bloomKws = fx.keywords.filter((k) => k.trigger === 'onBloom');
            for (let i = 0; i < bloomKws.length; i++) {
              yield* tryRunAbilityInteractive(this, p, op, bloomKws[i], abilityKey(bl.n, 'kwB' + i), holo, rnd);
            }
          }
          if (holo.attachments) {
            for (const att of holo.attachments) {
              const afx = fxOf(this.DB, att.n);
              if (afx && afx.keywords) {
                const attBloomKws = afx.keywords.filter((k) => k.trigger === 'onBloom');
                for (let i = 0; i < attBloomKws.length; i++) {
                  yield* tryRunAbilityInteractive(this, p, op, attBloomKws[i], abilityKey(att.n, 'attB' + i), holo, rnd);
                }
              }
            }
          }
        }
        break;
      }
      case 'placeDebut': {
        const c = p.hand[action.handIdx];
        if (!c) break;
        p.hand.splice(action.handIdx, 1);
        p.back.push(Object.assign(makeHolo(c), { playedTurn: this.turn }));
        this.push('', `${p.name}: ${c.nm} をバックに出す`);
        break;
      }
      case 'playSupport': {
        const card = p.hand[action.handIdx];
        if (!card) break;
        const fx = fxOf(this.DB, card.n);
        const isAttach = (card.st === 'ツール' || card.st === 'マスコット' || card.st === 'ファン');
        if (!isAttach && (!fx || !fx.ability)) break;
        const key = abilityKey(card.n, 'sup');
        const isLimited = !!(card.ltd);
        if (isAttach) {
          const attachFilter = fx && fx.attachFilter;
          const targets = this.allHolos(p).filter((h) => !attachFilter || matchesFilter(h.card, attachFilter));
          // Enforce 1-per-holomen for ツール and マスコット
          const filtered = targets.filter((h) => {
            if (card.st === 'ファン') return true; // multiple fans OK
            return !h.attachments.some((a) => a.st === card.st);
          });
          if (filtered.length) {
            let host;
            if (filtered.length === 1) {
              host = filtered[0];
            } else {
              const attachChoice = yield { type: 'supportTarget', player: who, candidates: filtered, prompt: `${card.nm} を付けるホロメンを選択` };
              host = filtered.find((h) => h.id === attachChoice) || filtered[0];
            }
            host.attachments.push(card);
            p.hand.splice(action.handIdx, 1);
            if (fx && fx.ability) markUsed(p, key, 'game');
            this.push('', `${p.name}: ${host.card.nm} に〈${card.nm}〉を付けた`);
          }
        } else {
          p.hand.splice(action.handIdx, 1);
          markUsed(p, key, fx.ability.once || 'turn');
          if (isLimited) p.limitedUsedTurn = true;
          const ctx = { game: this, me: p, op, self: p.center, rnd };
          yield* runActionsInteractive(fx.ability.do, ctx);
          p.archive.push(card);
          this.push('', `${p.name}: 〈${card.nm}〉を使用`);
          yield { type: 'event', event: 'supportUsed', player: who, name: card.nm };
        }
        break;
      }
      case 'collab': {
        const cand = p.back.find((h) => h.id === action.holoId);
        if (!cand) break;
        p.back.splice(p.back.indexOf(cand), 1); p.collab = cand; p.usedCollab = true;
        // Collab rule: move top card of deck to holoPower
        if (p.deck.length) p.holoPower.push(p.deck.shift());
        this.push('', `${p.name}: ${cand.card.nm} をコラボ（ホロパワー+1）`);
        yield { type: 'event', event: 'collab', player: who, holoId: cand.id, name: cand.card.nm };
        if (this.effectsOn) {
          const fx = fxOf(this.DB, cand.card.n);
          if (fx && fx.keywords) {
            const collabKws = fx.keywords.filter((k) => k.trigger === 'onCollab');
            for (let i = 0; i < collabKws.length; i++) {
              yield* tryRunAbilityInteractive(this, p, op, collabKws[i], abilityKey(cand.card.n, 'kwC' + i), cand, rnd);
            }
          }
        }
        break;
      }
      case 'oshiSkill': {
        const fx = fxOf(this.DB, p.oshiCard.n);
        if (!fx || !fx.oshi) break;
        const cost = (fx.oshi.cost && fx.oshi.cost.holopower) || 0;
        for (let i = 0; i < cost && p.deck.length; i++) p.holoPower.push(p.deck.shift());
        yield* tryRunAbilityInteractive(this, p, op, fx.oshi, abilityKey(p.oshiCard.n, 'oshi'), p.center, rnd);
        this.push('', `${p.name}: 推しスキル「${fx.oshi.name || ''}」`);
        break;
      }
      case 'spSkill': {
        const fx = fxOf(this.DB, p.oshiCard.n);
        if (!fx || !fx.sp) break;
        const cost = (fx.sp.cost && fx.sp.cost.holopower) || 0;
        for (let i = 0; i < cost && p.deck.length; i++) p.holoPower.push(p.deck.shift());
        yield* tryRunAbilityInteractive(this, p, op, fx.sp, abilityKey(p.oshiCard.n, 'sp'), p.center, rnd);
        this.push('', `${p.name}: SP推しスキル「${fx.sp.name || ''}」`);
        break;
      }
      case 'baton': {
        const better = p.back.find((h) => h.id === action.holoId);
        if (!better) break;
        const need = this.DB.get(p.center.card.n).baton;
        for (let i = 0; i < need; i++) p.archive.push({ t: 'cheer', c: [p.center.cheer.pop()] });
        p.back.splice(p.back.indexOf(better), 1);
        const old = p.center; p.center = better; p.back.push(old);
        this.push('', `${p.name}: バトンタッチ → ${better.card.nm} がセンター`);
        break;
      }
    }
  };

  Game.prototype.performArtInteractive = function* (attacker, me, op) {
    const who = me === this.A ? 'A' : 'B';
    if (!op.center) return;
    const entry = this.DB.get(attacker.card.n);
    const payableArts = entry.arts.map((art, i) => ({ art, idx: i })).filter(({ art }) => canPay(effCost(art, attacker), attacker.cheer));
    if (!payableArts.length) return;

    // Let the player choose an art or skip
    const artChoice = yield {
      type: 'artChoice', player: who, holo: attacker,
      arts: payableArts.map(({ art, idx }) => ({ idx, power: art.power + (attacker.buffArt || 0), cost: art.cost })),
      prompt: `${attacker.card.nm} のアーツを選択`
    };
    if (artChoice === 'skip') return;
    const artIdx = artChoice >= 0 ? artChoice : payableArts[payableArts.length - 1].idx;
    const art = entry.arts[artIdx];
    if (!art) return;

    const attStatic = this.effectsOn ? this.applyAttachmentStatics(attacker) : { artBonus: 0 };
    const dmg = art.power + (attacker.buffArt || 0) + attStatic.artBonus;
    const targetNm = op.center.card.nm;
    op.center.dmg += dmg;
    const cls = me === this.A ? 'ta' : 'tb';
    this.push(cls, `T${this.turn} ${me.name}: ${attacker.card.nm} → ${targetNm} に ${dmg}`);
    yield { type: 'event', event: 'artHit', attacker: attacker.id, target: op.center.id, dmg, attackerName: attacker.card.nm, targetName: targetNm, player: who };

    if (this.effectsOn) {
      const fx = fxOf(this.DB, attacker.card.n);
      if (fx && fx.arts && fx.arts[artIdx]) {
        tryRunAbility(this, me, op, fx.arts[artIdx], abilityKey(attacker.card.n, 'art' + artIdx), attacker, this.rndFor(me));
      }
      if (op.center) {
        const defFx = fxOf(this.DB, op.center.card.n);
        if (defFx && defFx.keywords) {
          defFx.keywords.filter((k) => k.trigger === 'onDamageTaken').forEach((k, i) => {
            if (op.center) tryRunAbility(this, op, me, k, abilityKey(op.center.card.n, 'kwD' + i), op.center, this.rndFor(op));
          });
        }
      }
    }

    if (op.center && op.center.dmg >= ((op.center.card.hp || 0) + (this.effectsOn ? this.applyAttachmentStatics(op.center).hp - (op.center.card.hp || 0) : 0))) {
      yield* this.downCenterInteractive(op, me);
    }
    yield { type: 'event', event: 'artDone' };
  };

  Game.prototype.takeTurnInteractive = function* (who) {
    const me = this[who], op = who === 'A' ? this.B : this.A;
    if (me.lost || op.lost) return;
    this.turn++;
    const isFirstPlayer = (who === this.first);
    const isMyFirstTurn = !me._hadTurn; // first turn for this player
    me._hadTurn = true;
    const isFirstPlayerFirstTurn = isMyFirstTurn && isFirstPlayer;
    const isAnyFirstTurn = isMyFirstTurn;

    // Reset step: skipped on both players' first turn (official rules)
    this._phase = 'reset';
    if (!isAnyFirstTurn) {
      if (me.collab) { me.back.push(me.collab); me.collab = null; }
      this.allHolos(me).forEach((h) => { h.rested = false; h.buffArt = 0; h.costReduce = 0; });
    }
    me.usedCollab = false; me.usedTurn.clear(); me.limitedUsedTurn = false;

    // Draw step: both players draw on their first turn (official rules)
    this._phase = 'draw';
    this.draw(me, 1); yield { type: 'event', event: 'draw', player: who };
    if (me.lost) return;

    // Cheer step: both players attach cheer on their first turn
    this._phase = 'cheer';
    yield* this.attachCheerInteractive(me);
    yield { type: 'event', event: 'cheerDone' };

    // Main phase: bloom blocked on both T1, LIMITED blocked on first player T1
    this._phase = 'main';
    let mainGuard = 0;
    while (mainGuard++ < 30) {
      const actions = aiGetMainActions(me, op, this.turn, this, { noBloom: isAnyFirstTurn, noLimited: isFirstPlayerFirstTurn });
      if (!actions.length) break;
      actions.push({ act: 'endMain', label: 'メインフェイズ終了' });
      const choice = yield { type: 'mainAction', player: who, actions, prompt: 'メインフェイズ：アクションを選択' };
      if (!choice || choice.act === 'endMain') break;
      yield* this.executeMainAction(me, op, choice);
      if (me.lost || op.lost) return;
    }

    // Performance step: skipped on first player's first turn only
    this._phase = 'art';
    if (!isFirstPlayerFirstTurn) {
      if (me.center && !me.lost && !op.lost) {
        yield* this.performArtInteractive(me.center, me, op);
      }
      if (op.lost || me.lost) return;
      if (me.collab && !me.lost && !op.lost) {
        yield* this.performArtInteractive(me.collab, me, op);
      }
    }
    if (me.collab) me.collab.rested = true;
    this._phase = '';
  };

  Game.prototype.playInteractive = function* (maxTurns) {
    yield* this.setupInteractive();
    if (this.A.lost && this.B.lost) return this.finish(this.rndSys() < 0.5 ? 'A' : 'B');
    if (this.A.lost) return this.finish('B');
    if (this.B.lost) return this.finish('A');
    const order = this.first === 'A' ? ['A', 'B'] : ['B', 'A'];
    let idx = 0;
    while (this.turn < (maxTurns || 60)) {
      const who = order[idx % 2];
      yield { type: 'event', event: 'turnStart', player: who, turn: this.turn + 1 };
      yield* this.takeTurnInteractive(who);
      const other = who === 'A' ? 'B' : 'A';
      if (this[other].lost) return this.finish(who);
      if (this[who].lost) return this.finish(other);
      idx++;
    }
    let w;
    if (this.A.life > this.B.life) w = 'A';
    else if (this.B.life > this.A.life) w = 'B';
    else w = this.rndSys() < 0.5 ? 'A' : 'B';
    this.push('', '規定ターン到達：ライフ優勢で判定');
    return this.finish(w, true);
  };

  /* --- BattleDriver: runs the generator, dispatches to AI or human --- */
  function BattleDriver(game, humanPlayer, callbacks) {
    this.game = game;
    this.humanPlayer = humanPlayer; // 'A', 'B', or null (AI vs AI watch mode)
    this.onState = callbacks.onState || function () {};
    this.onDecision = callbacks.onDecision || function () {};
    this.onEnd = callbacks.onEnd || function () {};
    this.onLog = callbacks.onLog || function () {};
    this._resolve = null;
    this._running = false;
    this._paused = false;
    this.aiDelay = callbacks.aiDelay || 400;
  }
  BattleDriver.prototype.submitChoice = function (choice) {
    if (this._resolve) { const r = this._resolve; this._resolve = null; r(choice); }
  };
  BattleDriver.prototype.run = async function (maxTurns) {
    this._running = true;
    const gen = this.game.playInteractive(maxTurns);
    let result = gen.next();
    while (!result.done && this._running) {
      const d = result.value;
      if (d.type === 'event') {
        this.onLog(d);
        this.onState(snapshot(this.game));
        const animEvents = { turnStart: 1, downed: 1.5, artHit: 2.2, bloom: 1.2, collab: 0.8, supportUsed: 0.8 };
        const mult = animEvents[d.event];
        if (mult) {
          await new Promise((r) => setTimeout(r, Math.floor(this.aiDelay * mult)));
        }
        result = gen.next();
      } else if (this.humanPlayer && d.player === this.humanPlayer) {
        this.onState(snapshot(this.game));
        const choice = await new Promise((resolve) => { this._resolve = resolve; this.onDecision(d); });
        result = gen.next(choice);
      } else {
        // AI resolves
        if (this.aiDelay > 0) await new Promise((r) => setTimeout(r, Math.floor(this.aiDelay * (0.5 + Math.random() * 0.5))));
        const choice = aiResolve(d, this.game);
        this.onState(snapshot(this.game));
        result = gen.next(choice);
      }
    }
    if (result.done) {
      this.onState(snapshot(this.game));
      this.onEnd(result.value);
    }
    this._running = false;
  };
  BattleDriver.prototype.stop = function () { this._running = false; };

  /* ---------- public API ---------- */
  function buildDB(cards, effects) {
    const m = new Map();
    cards.forEach((c) => m.set(c.n, Object.assign({}, c, analyzeCard(c, effects ? effects[c.n] : null))));
    return m;
  }

  function playGame(deckA, deckB, DB, opts) { return new Game(deckA, deckB, DB, opts).play(opts && opts.maxTurns); }

  function simulate(deckA, deckB, DB, games, opts) {
    let wa = 0, wb = 0, tsum = 0;
    const reasons = {};
    const half = Math.floor(games / 2);
    for (let i = 0; i < games; i++) {
      const swap = i < half;
      const r = swap
        ? new Game(deckB, deckA, DB, opts || {}).play()
        : new Game(deckA, deckB, DB, opts || {}).play();
      const winnerIsDeckA = swap ? r.winner === 'B' : r.winner === 'A';
      if (winnerIsDeckA) wa++; else wb++;
      tsum += r.turns;
      reasons[r.reason] = (reasons[r.reason] || 0) + 1;
    }
    return { wa, wb, games, avgTurn: (tsum / games), reasons };
  }

  function createInteractiveGame(deckA, deckB, DB, opts) {
    return new Game(deckA, deckB, DB, Object.assign({ log: true, effects: true }, opts || {}));
  }

  const api = { buildDB, playGame, simulate, analyzeCard, parseArt, canPay, createInteractiveGame, BattleDriver, snapshot, aiResolve };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (typeof window !== 'undefined') window.HoloEngine = api;
})();
</script>
<script>
"use strict";
/* ===================== data ===================== */
const CARDS = JSON.parse(document.getElementById('carddata').textContent);
const EFFECTS = JSON.parse(document.getElementById('effectsdata').textContent);
const BYNUM = new Map(CARDS.map(c=>[c.n,c]));
const ENGINE_DB = HoloEngine.buildDB(CARDS, EFFECTS);
const COLORS = ['白','緑','赤','青','紫','黄','無'];
const COLORVAR = {'白':'var(--c-white)','緑':'var(--c-green)','赤':'var(--c-red)','青':'var(--c-blue)','紫':'var(--c-purple)','黄':'var(--c-yellow)','無':'var(--c-none)'};
const LEVELS = ['Debut','1st','2nd','Spot'];
const LEVELCOLOR = {'Debut':'#5ad1cf','1st':'#7c9cff','2nd':'#c56cff','Spot':'#8a94a6'};
const CATS = [['all','すべて'],['oshi','推しホロメン'],['holomen','ホロメン'],['support','サポート'],['cheer','エール']];
const SETS = [...new Set(CARDS.map(c=>c.set))].sort();
const LIMIT = {main:50,cheer:20,perCard:4};
const UNLIMITED = new Set([
  'hBP01-009','hBP01-015','hBP01-021','hBP01-024','hBP01-028','hBP01-032',
  'hBP01-038','hBP01-044','hBP01-048','hBP01-052','hBP01-056','hBP01-062',
  'hBP01-068','hBP01-072','hBP01-076','hBP01-082','hBP01-088','hBP01-092',
  'hBP02-008','hBP02-014','hBP02-018','hBP02-024','hBP02-028','hBP02-035',
  'hBP02-042','hBP02-048','hBP02-054','hBP02-061','hBP02-065',
  'hBP03-009','hBP03-016','hBP03-025','hBP03-031','hBP03-037','hBP03-040',
  'hBP03-046','hBP03-051','hBP03-057','hBP03-061','hBP03-067','hBP03-073','hBP03-080',
  'hBP04-008','hBP04-016','hBP04-020','hBP04-028','hBP04-032','hBP04-039',
  'hBP04-043','hBP04-050','hBP04-054','hBP04-063','hBP04-067','hBP04-073',
  'hBP04-079','hBP04-083',
  'hBP06-015',
  'hSD02-002','hSD03-002','hSD04-002','hSD05-002','hSD07-002',
  'hSD10-002','hSD10-007','hSD11-002','hSD11-007',
  'hSD13-003','hSD13-008'
]);

/* ===================== state ===================== */
const state = {
  oshi:null, main:{}, cheer:{}, name:'無題のデッキ',
  f:{q:'',cat:'all',colors:new Set(),levels:new Set(),set:'',sort:'num'},
  tab:'list'
};

/* ===================== helpers ===================== */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function catOf(c){return c.t;}
function colorsOf(c){return (c.c&&c.c.length)?c.c:['無'];}
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

/* ===================== filtering ===================== */
function matches(c){
  const f=state.f;
  if(f.cat!=='all' && c.t!==f.cat) return false;
  if(f.set && c.set!==f.set) return false;
  if(f.colors.size){ const cs=colorsOf(c); if(![...f.colors].some(x=>cs.includes(x))) return false; }
  if(f.levels.size){ if(!c.bl || !f.levels.has(c.bl)) return false; }
  if(f.q){
    const q=f.q.toLowerCase();
    const hay=[c.n,c.nm,(c.tg||[]).join(' '),c.tx?JSON.stringify(c.tx):''].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function sortCards(arr){
  const f=state.f;
  if(f.sort==='name') arr.sort((a,b)=>a.nm.localeCompare(b.nm,'ja'));
  else if(f.sort==='hp') arr.sort((a,b)=>(b.hp||0)-(a.hp||0));
  else arr.sort((a,b)=>a.n.localeCompare(b.n,'en',{numeric:true}));
  return arr;
}

/* ===================== pool render (windowed) ===================== */
let poolResults=[], poolShown=0;
const PAGE=90;
function renderPool(reset=true){
  if(reset){ poolResults=sortCards(CARDS.filter(matches)); poolShown=0; $('#grid').innerHTML=''; }
  const grid=$('#grid');
  $('#poolCount').textContent=`${poolResults.length} 件`;
  const old=$('#moreWrap'); if(old) old.remove();
  if(!poolResults.length){ grid.innerHTML='<div class="empty">条件に合うカードがありません</div>'; return; }
  const slice=poolResults.slice(poolShown,poolShown+PAGE);
  const frag=document.createDocumentFragment();
  for(const c of slice) frag.appendChild(cardTile(c));
  grid.appendChild(frag);
  poolShown+=slice.length;
  if(poolShown<poolResults.length){
    const w=el('div','moreWrap');w.id='moreWrap';w.style.gridColumn='1/-1';w.style.textAlign='center';w.style.padding='6px 0 24px';
    const b=el('button','btn','あと '+(poolResults.length-poolShown)+' 件を表示');
    b.onclick=()=>renderPool(false); w.appendChild(b); grid.appendChild(w);
  }
}
function countInDeck(c){
  if(c.t==='oshi') return state.oshi===c.n?1:0;
  if(c.t==='cheer') return state.cheer[c.n]||0;
  return state.main[c.n]||0;
}
function cardTile(c){
  const t=el('div','card'); t.title=c.nm+' ('+c.n+')'; t.dataset.n=c.n;
  const cnt=countInDeck(c);
  const img=c.img?`<img loading="lazy" src="${c.img}" alt="${esc(c.nm)}">`:`<div class="noimg">${esc(c.nm)}</div>`;
  const lvl=c.bl?`<span class="lvl" style="background:${LEVELCOLOR[c.bl]||'#556'};color:#0c0e14">${c.bl}</span>`:'';
  t.innerHTML=`${img}<span class="cnum">${c.n}</span>${lvl}<span class="incount" style="${cnt?'':'display:none'}">${cnt}</span>`;
  t.onclick=()=>addCard(c);
  t.oncontextmenu=(e)=>{e.preventDefault();openModal(c);};
  return t;
}

/* ===================== add / remove ===================== */
function addCard(c){
  if(c.t==='oshi'){ state.oshi=c.n; toast('推しホロメンを設定: '+c.nm); afterChange(); return; }
  if(c.t==='cheer'){
    if(sum(state.cheer)>=LIMIT.cheer){ toast('エールデッキは20枚までです'); return; }
    state.cheer[c.n]=(state.cheer[c.n]||0)+1; afterChange(); return;
  }
  // main deck
  const cur=state.main[c.n]||0;
  if(!UNLIMITED.has(c.n) && cur>=LIMIT.perCard){ toast('同名カードは4枚までです'); return; }
  if(sum(state.main)>=LIMIT.main){ toast('メインデッキは50枚までです'); return; }
  state.main[c.n]=cur+1; afterChange();
}
function setQty(store,num,q){ if(q<=0) delete store[num]; else store[num]=q; afterChange(); }
function afterChange(){ renderDeck(); updateCounts(); updateValidation(); persistHash(); refreshVisibleCounts(); if(typeof updateDeckBadge==='function')updateDeckBadge(); }
function refreshVisibleCounts(){
  document.querySelectorAll('#grid .card').forEach(t=>{
    const c=BYNUM.get(t.dataset.n); if(!c) return;
    const cnt=countInDeck(c); const badge=t.querySelector('.incount');
    if(!badge) return; badge.textContent=cnt; badge.style.display=cnt?'':'none';
  });
}

/* ===================== counts + validation ===================== */
function updateCounts(){
  const m=sum(state.main), ch=sum(state.cheer), o=state.oshi?1:0;
  const set=(id,v,max,good)=>{const b=$(id);b.querySelector('.v').innerHTML=`${v}<small>/${max}</small>`;
    b.classList.toggle('good',good);b.classList.toggle('bad',!good && v>0 || v>max);};
  set('#cOshi',o,1,o===1);
  set('#cMain',m,50,m===50);
  set('#cCheer',ch,20,ch===20);
}
function validate(){
  const errs=[],warns=[],oks=[];
  const m=sum(state.main), ch=sum(state.cheer);
  // oshi
  if(!state.oshi) errs.push('推しホロメンが設定されていません（1枚必要）');
  else oks.push('推しホロメン: '+BYNUM.get(state.oshi).nm);
  // main count
  if(m<50) errs.push(`メインデッキが${m}枚です（50枚ちょうど必要／あと${50-m}枚）`);
  else if(m>50) errs.push(`メインデッキが${m}枚です（50枚を${m-50}枚超過）`);
  else oks.push('メインデッキ 50枚 ✔');
  // cheer count
  if(ch<20) errs.push(`エールデッキが${ch}枚です（20枚ちょうど必要／あと${20-ch}枚）`);
  else if(ch>20) errs.push(`エールデッキが${ch}枚です（20枚を${ch-20}枚超過）`);
  else oks.push('エールデッキ 20枚 ✔');
  // per-card limit (main)
  const over=Object.entries(state.main).filter(([n,q])=>q>4 && !UNLIMITED.has(n));
  over.forEach(([n,q])=>errs.push(`${BYNUM.get(n).nm}（${n}）が${q}枚（同名は4枚まで）`));
  // cheer must be エール (guaranteed by add), verify anyway
  Object.keys(state.cheer).forEach(n=>{if(BYNUM.get(n).t!=='cheer')errs.push(n+'はエールではありません');});
  // warnings: color spread of oshi vs deck
  if(state.oshi){
    const oc=colorsOf(BYNUM.get(state.oshi));
    const deckColors=new Set();
    Object.keys(state.main).forEach(n=>colorsOf(BYNUM.get(n)).forEach(x=>x!=='無'&&deckColors.add(x)));
    const off=[...deckColors].filter(x=>!oc.includes(x));
    if(oc[0]!=='無' && off.length) warns.push(`推し（${oc.join('/')}）と異なる色のホロメンがいます: ${off.join('/')}（推しスキルの色条件に注意）`);
  }
  // debut presence
  const hasDebut=Object.keys(state.main).some(n=>BYNUM.get(n).bl==='Debut');
  if(m>0 && !hasDebut) warns.push('Debutホロメンがいません。最初にステージへ出せるホロメンが必要です');
  const cheerColors=new Set();Object.keys(state.cheer).forEach(n=>colorsOf(BYNUM.get(n)).forEach(x=>cheerColors.add(x)));
  return {errs,warns,oks,valid:errs.length===0};
}
function updateValidation(){
  const v=validate();
  const b=$('#valbadge');
  b.className='badge '+(v.valid?'ok':'bad');
  b.textContent=v.valid?'✓ 有効なデッキ':`⚠ ${v.errs.length} 件の問題`;
  if(state.tab==='check') renderDeck();
}

/* ===================== deck render ===================== */
function renderDeck(){
  const body=$('#deckBody');
  if(state.tab==='list') return renderList(body);
  if(state.tab==='stats') return renderStats(body);
  if(state.tab==='check') return renderCheck(body);
}
function drow(c,store){
  const q=store===state.cheer?state.cheer[c.n]:state.main[c.n];
  const r=el('div','drow');
  const img=c.img?`<img src="${c.img}" alt="">`:`<div style="width:38px;height:53px;background:var(--bg);border-radius:4px"></div>`;
  const cols=colorsOf(c).map(x=>`<span class="dot" style="background:${COLORVAR[x]}"></span>`).join('');
  const sub=[c.bl,c.st,c.hp?('HP'+c.hp):''].filter(Boolean).join(' · ');
  r.innerHTML=`${img}<div class="meta"><div class="nm">${esc(c.nm)}</div><div class="sub">${cols}${c.n} ${sub?'· '+sub:''}</div></div>`;
  r.querySelector('img,div').style.cursor='pointer';
  r.querySelector('.meta').onclick=()=>openModal(c);
  if(r.querySelector('img')) r.querySelector('img').onclick=()=>openModal(c);
  const st=el('div','stepper');
  st.innerHTML=`<button>−</button><span class="qty">${q}</span><button>＋</button>`;
  st.children[0].onclick=()=>setQty(store,c.n,q-1);
  st.children[2].onclick=()=>addCard(c);
  r.appendChild(st);
  return r;
}
function renderList(body){
  body.innerHTML='';
  // oshi
  body.appendChild(el('div','section-t','推しホロメン'));
  const os=el('div','oshislot'+(state.oshi?' filled':''));
  if(state.oshi){
    const c=BYNUM.get(state.oshi);
    os.innerHTML=`<img src="${c.img}" alt=""><div class="meta"><div class="nm" style="font-weight:700">${esc(c.nm)}</div><div class="sub" style="color:var(--muted);font-size:12px">${c.n} · LIFE ${c.lf||'-'} · ${colorsOf(c).join('/')}</div></div>`;
    const rm=el('button','btn ghost','×');rm.onclick=()=>{state.oshi=null;afterChange();};os.appendChild(rm);
    os.querySelector('img').style.cursor='pointer';os.querySelector('img').onclick=()=>openModal(c);
  } else os.innerHTML='<div class="oshi-empty">推しホロメンを選択してください（左のリストで「推しホロメン」カードをクリック）</div>';
  body.appendChild(os);

  // main grouped by level then type
  body.appendChild(el('div','section-t',`メインデッキ（${sum(state.main)}/50）`));
  const mainCards=Object.keys(state.main).map(n=>BYNUM.get(n));
  const groups=[['Debut','Debut'],['1st','1st'],['2nd','2nd'],['Spot','Spot'],['support','サポート']];
  for(const [key,label] of groups){
    let cs;
    if(key==='support') cs=mainCards.filter(c=>c.t==='support');
    else cs=mainCards.filter(c=>c.t==='holomen'&&c.bl===key);
    if(!cs.length) continue;
    sortCards(cs);
    const n=cs.reduce((a,c)=>a+state.main[c.n],0);
    body.appendChild(el('div','grouplabel',`<span>${label}</span><span>${n}枚</span>`));
    cs.forEach(c=>body.appendChild(drow(c,state.main)));
  }
  if(!mainCards.length) body.appendChild(el('div','empty','メインデッキが空です'));

  // cheer
  body.appendChild(el('div','section-t',`エールデッキ（${sum(state.cheer)}/20）`));
  const cheerCards=Object.keys(state.cheer).map(n=>BYNUM.get(n));
  if(cheerCards.length){ sortCards(cheerCards); cheerCards.forEach(c=>body.appendChild(drow(c,state.cheer))); }
  else body.appendChild(el('div','empty','エールデッキが空です（エールカードをクリック）'));
}

/* ===================== stats ===================== */
function renderStats(body){
  body.innerHTML='';
  const wrap=el('div','stats');
  const mainCards=Object.entries(state.main).map(([n,q])=>[BYNUM.get(n),q]);
  // color balance (holomen only, count copies)
  const colCount={}; COLORS.forEach(c=>colCount[c]=0);
  let coloredTotal=0;
  mainCards.forEach(([c,q])=>{ if(c.t==='holomen'){ colorsOf(c).forEach(col=>{colCount[col]+=q;coloredTotal+=q;}); }});
  wrap.appendChild(colorDonut(colCount,coloredTotal));
  // level distribution
  const lvl={}; LEVELS.forEach(l=>lvl[l]=0);
  mainCards.forEach(([c,q])=>{ if(c.bl&&lvl[c.bl]!=null) lvl[c.bl]+=q; });
  wrap.appendChild(hbarBlock('Bloomレベル分布', LEVELS.map(l=>[l,lvl[l],LEVELCOLOR[l]])));
  // card type breakdown
  const holo=mainCards.filter(([c])=>c.t==='holomen').reduce((a,[,q])=>a+q,0);
  const supByType={};
  mainCards.forEach(([c,q])=>{ if(c.t==='support'){const k=c.st||'サポート';supByType[k]=(supByType[k]||0)+q;} });
  const typeRows=[['ホロメン',holo,'#5ad1cf'],...Object.entries(supByType).map(([k,v],i)=>[k,v,['#7c5cff','#e6b800','#4bbf73','#e5484d','#4c8dff','#a668e8'][i%6]])];
  wrap.appendChild(hbarBlock('カードタイプ内訳', typeRows));
  // cheer colors
  const chc={}; COLORS.forEach(c=>chc[c]=0); let cht=0;

/* ===================== arts / power parsing ===================== */
function artsPower(c){
  if(!c||c.t!=='holomen'||!c.tx||!c.tx.a) return 0;
  let best=0;
  c.tx.a.forEach(a=>{
    // 1行目 = "[コスト]アーツ名　基礎値+[特効]"。角括弧（コスト・特効）を除去し、
    // アーツ名に含まれる数字を避けるため“最後の数値”を基礎値として採用する。
    const line=a.split('\n')[0].replace(/\[[^\]]*\]/g,' ');
    const nums=(line.match(/\d+/g)||[]).map(Number);
    if(nums.length) best=Math.max(best, nums[nums.length-1]);
  });
  return best;
}
function levelCount(main,level){return Object.entries(main).reduce((a,[n,q])=>a+(BYNUM.get(n)?.bl===level?q:0),0);}
function mainCount(main){return Object.values(main).reduce((a,b)=>a+b,0);}

/* ===================== auto deck build ===================== */
function basicCheer(color){
  return CARDS.find(c=>c.t==='cheer'&&c.c.length===1&&c.c[0]===color)
      || CARDS.find(c=>c.t==='cheer'&&c.c.includes(color));
}
function autoBuild(oshiNum,trumpNum){
  const oshi=BYNUM.get(oshiNum);
  if(!oshi||oshi.t!=='oshi') return {err:'推しホロメンを選択してください'};
  const trump=trumpNum?BYNUM.get(trumpNum):null;
  let colors=[...new Set([...(oshi.c||[]),...(trump&&trump.t!=='support'?(trump.c||[]):[])].filter(x=>x&&x!=='無'))];
  if(!colors.length) colors=['白'];

  const main={};
  const add=(c,q)=>{ if(!c)return; main[c.n]=Math.min(4,(main[c.n]||0)+q); };
  const preferNames=new Set();

  // 1) 切り札ラインを最優先で投入（同名は各レベル1枚ずつでブルームラインを作る）
  if(trump){
    if(trump.t==='holomen'){
      preferNames.add(trump.nm);
      add(trump,4);
      ['Debut','1st','2nd'].forEach(L=>{
        if(L===trump.bl) return;
        const same=CARDS.filter(c=>c.t==='holomen'&&c.nm===trump.nm&&c.bl===L)
          .sort((a,b)=>artsPower(b)-artsPower(a))[0];
        if(same) add(same, L==='2nd'?3:4);
      });
    } else if(trump.t==='support'){ add(trump,4); }
  }

  // 2) レベル別の目標枚数でホロメンを積む（Debut18 / 1st14 / 2nd6）
  const targets={'Debut':18,'1st':14,'2nd':6};
  const pickLevel=(level,target)=>{
    const cand=CARDS.filter(c=>c.t==='holomen'&&c.bl===level&&c.c.some(x=>colors.includes(x)));
    cand.sort((a,b)=>{
      const pa=preferNames.has(a.nm)?1:0, pb=preferNames.has(b.nm)?1:0;
      if(pa!==pb) return pb-pa;                       // 既存ラインの名前を優先（ブルーム用）
      return artsPower(b)-artsPower(a);                // 次にアーツ火力
    });
    for(const c of cand){
      if(levelCount(main,level)>=target) break;
      const room=Math.min(4,target-levelCount(main,level));
      add(c,room);
      if(c.bl!=='Debut') preferNames.add(c.nm);
    }
  };
  pickLevel('Debut',targets.Debut);
  pickLevel('1st',targets['1st']);
  // 2ndは、採用済みDebut/1stと同名を最優先
  pickLevel('2nd',targets['2nd']);

  // 3) サポートで50枚まで埋める（多くの商品に再録＝定番として優先）
  const supTarget=50;
  const supports=CARDS.filter(c=>c.t==='support')
    .sort((a,b)=>((b.pr||[]).length-(a.pr||[]).length)||a.n.localeCompare(b.n,'en',{numeric:true}));
  for(const c of supports){
    if(mainCount(main)>=supTarget) break;
    add(c,Math.min(4,supTarget-mainCount(main)));
  }
  // まだ足りなければホロメンで補充
  if(mainCount(main)<50){
    const extra=CARDS.filter(c=>c.t==='holomen'&&c.c.some(x=>colors.includes(x)))
      .sort((a,b)=>artsPower(b)-artsPower(a));
    for(const c of extra){ if(mainCount(main)>=50)break; add(c,Math.min(4,50-mainCount(main))); }
  }
  // 超過していれば末尾から削る
  while(mainCount(main)>50){
    const keys=Object.keys(main); const k=keys[keys.length-1];
    main[k]-=1; if(main[k]<=0) delete main[k];
  }

  // 4) エールデッキ20枚：採用ホロメンの色比率で配分
  const colw={}; let tot=0;
  Object.entries(main).forEach(([n,q])=>{const c=BYNUM.get(n);if(c.t==='holomen')c.c.forEach(col=>{if(col!=='無'){colw[col]=(colw[col]||0)+q;tot+=q;}});});
  if(!tot){ colors.forEach(c=>colw[c]=1); tot=colors.length; }
  const cheer={};
  let assigned=0; const entries=Object.entries(colw).sort((a,b)=>b[1]-a[1]);
  entries.forEach(([col,w],i)=>{
    let n=Math.round(20*w/tot);
    if(i===entries.length-1) n=20-assigned;          // 端数は最後で調整
    n=Math.max(0,Math.min(20-assigned,n));
    const cc=basicCheer(col); if(cc&&n>0){cheer[cc.n]=(cheer[cc.n]||0)+n;assigned+=n;}
  });
  if(assigned<20){ const cc=basicCheer(entries[0]?.[0]||colors[0]); if(cc)cheer[cc.n]=(cheer[cc.n]||0)+(20-assigned); }

  return {oshi:oshiNum,main,cheer,colors,name:`おすすめ：${oshi.nm}${trump?'／'+trump.nm:''}`};
}

/* ===================== battle simulation (real rules engine) ===================== */
// Phase1ルールエンジン（engine.cjs / HoloEngineとして埋め込み）を使用。
// 盤面・ターン進行・ブルーム・エール経済・バトンタッチ・ライフ処理を忠実に再現し、
// 勝率はA/Bスロットを入れ替えて平均するモンテカルロ（HoloEngine.simulate）で推定する。
// カード固有効果はまだ未実装（バニラ＝アーツ火力/HP/色コストのみ）。詳細はENGINE-DESIGN.md参照。
function deckSummary(d){
  const main=Object.entries(d.main||{}).map(([n,q])=>[BYNUM.get(n),q]).filter(([c])=>c);
  const oshi=d.oshi?BYNUM.get(d.oshi):null;
  const life=oshi?.lf||5;
  const lvlAtk={}, lvlHP={};
  ['Debut','1st','2nd'].forEach(L=>{
    const cs=main.filter(([c])=>c.t==='holomen'&&c.bl===L);
    let hp=0,n=0,bestPow=0;
    cs.forEach(([c,q])=>{ bestPow=Math.max(bestPow, artsPower(c)); hp+=(c.hp||0)*q; n+=q; });
    lvlAtk[L]=bestPow; lvlHP[L]= n? hp/n : 0;
  });
  let ct=0; const cheerColors={};
  Object.entries(d.cheer||{}).forEach(([n,q])=>{const c=BYNUM.get(n);if(c)c.c.forEach(col=>{cheerColors[col]=(cheerColors[col]||0)+q;ct+=q;});});
  const deckColors=new Set(); main.forEach(([c])=>{if(c.t==='holomen')c.c.forEach(x=>x!=='無'&&deckColors.add(x));});
  let match=0,tot=0; [...deckColors].forEach(col=>{tot++;if(cheerColors[col])match++;});
  const cheerFit = tot? match/tot : 1;
  return {life,lvlAtk,lvlHP,cheerFit,oshiName:oshi?.nm||'—',name:d.name||'デッキ'};
}
function runBattle(deckA,deckB,games=500){
  const A=deckSummary(deckA), B=deckSummary(deckB);
  const R=HoloEngine.simulate(deckA,deckB,ENGINE_DB,games,{maxTurns:60});
  // 代表サンプルログを1戦（実エンジンでプレイした本物のログ）
  const sample=HoloEngine.playGame(deckA,deckB,ENGINE_DB,{log:true,maxTurns:60});
  const log=sample.log.map(l=>({cls:l.cls,t:l.t}));
  return {A,B,wa:R.wa,wb:R.wb,games:R.games,avgTurn:R.avgTurn.toFixed(1),log};
}

let _battleDriver = null;
let _pendingDecision = null;

function colorDot(col) {
  return `<span class="cdot" style="background:${COLORVAR[col]||'var(--c-none)'}"></span>`;
}

function renderSlot(h, selectable, onClick) {
  if (!h) { const d = el('div','bv-slot'); d.innerHTML='<div class="bv-slot-empty"></div>'; return d; }
  const hp = h.hp || 1, dmg = h.dmg || 0, cur = Math.max(0, hp - dmg), pct = Math.round(cur / hp * 100);
  const cls = pct > 50 ? '' : pct > 20 ? ' warn' : ' crit';
  const d = el('div', 'bv-slot' + (selectable ? ' selectable' : ''));
  if (h.id != null) d.dataset.holoId = h.id;
  d.innerHTML = `${h.img ? `<img class="card-thumb" src="${h.img}" alt="${esc(h.nm)}" loading="lazy">` : `<div class="card-thumb" style="background:var(--bg3);display:grid;place-items:center;font-size:9px">${esc(h.nm)}</div>`}
    <div class="hp-bar"><div class="hp-fill${cls}" style="width:${pct}%"></div></div>
    <div class="cheer-dots">${(h.cheer||[]).map(colorDot).join('')}</div>
    <span class="slot-label">${esc(h.nm)}</span>
    ${dmg ? `<span class="dmg-text">-${dmg}</span>` : ''}
    ${h.buffArt ? `<span class="buff-text">+${h.buffArt}</span>` : ''}`;
  if (onClick) d.onclick = () => onClick(h);
  attachPopupEvents(d, h.n, h);
  return d;
}

function renderNameBar(p, isOp) {
  const pipHtml = Array.from({length: p.oshi.lf || 0}, (_, i) =>
    `<span class="pip${i >= p.life ? ' lost' : ''}"></span>`).join('');
  return `<span class="name">${isOp ? '🟪 ' : '🟦 '}${esc(p.name)}</span>
    <span class="life-pips">${pipHtml}</span>`;
}

function renderZoneStack(count, cls) {
  if (count <= 0) {
    return `<div class="zone-stack-wrap ${cls} empty"><div class="zs-card zs-c0"></div></div>`;
  }
  const n = Math.min(count, 3);
  let cards = '';
  for (let i = n - 1; i >= 0; i--) {
    cards += `<div class="zs-card zs-c${i}"><div class="zs-diamond"></div></div>`;
  }
  return `<div class="zone-stack-wrap ${cls}">${cards}<span class="zs-badge">${count}</span></div>`;
}

function renderZoneLeft(p) {
  return `${renderZoneStack(p.life, 'life')}
    <div class="zone-label">ライフ</div>
    ${renderZoneStack(p.cheerDeckCount, 'cheer-pile')}
    <div class="zone-label">エール</div>`;
}

function renderZoneRight(p) {
  return `${renderZoneStack(p.holoPowerCount, 'hp-zone')}
    <div class="zone-label">ホロパワー</div>
    ${renderZoneStack(p.deckCount, 'deck-zone')}
    <div class="zone-label">デッキ</div>
    ${renderZoneStack(p.archiveCount, 'archive-zone')}
    <div class="zone-label">アーカイブ</div>`;
}

function renderOshiSlot(oshi) {
  const d = el('div', 'bv-slot oshi-slot');
  d.innerHTML = `${oshi.img ? `<img class="card-thumb" src="${oshi.img}" alt="${esc(oshi.nm)}" loading="lazy">` : `<div class="card-thumb" style="background:var(--bg3);display:grid;place-items:center;font-size:8px">${esc(oshi.nm)}</div>`}
    <span class="slot-label">${esc(oshi.nm)}</span>`;
  attachPopupEvents(d, oshi.n, null);
  return d;
}

function renderFrontRow(container, p, isMe, selectableIds, onSelect) {
  container.innerHTML = '';
  const isSelectable = (h) => h && selectableIds && selectableIds.has(h.id);
  const collabSlot = p.collab ? renderSlot(p.collab, isSelectable(p.collab), isSelectable(p.collab) ? onSelect : null) : (() => { const e = el('div','bv-slot'); e.innerHTML = '<div class="bv-slot-empty">コラボ</div>'; return e; })();
  const centerSlot = p.center ? renderSlot(p.center, isSelectable(p.center), isSelectable(p.center) ? onSelect : null) : (() => { const e = el('div','bv-slot'); e.innerHTML = '<div class="bv-slot-empty">センター</div>'; return e; })();
  const oshiSlot = renderOshiSlot(p.oshi);
  if (isMe) {
    container.appendChild(collabSlot);
    container.appendChild(centerSlot);
    container.appendChild(oshiSlot);
  } else {
    container.appendChild(oshiSlot);
    container.appendChild(centerSlot);
    container.appendChild(collabSlot);
  }
}

function renderBattleState(snap, meKey) {
  const me = snap[meKey], op = snap[meKey === 'A' ? 'B' : 'A'];
  const phaseMap = {reset:'リセット',draw:'手札',cheer:'エール',main:'メイン',art:'パフォーマンス'};
  $('#bvTurn').textContent = `ターン ${snap.turn || 0}`;
  $('#bvPhase').textContent = snap.phase ? `[${phaseMap[snap.phase] || snap.phase}ステップ]` : '';

  // Determine which field cards are selectable from _pendingDecision
  let selectableIds = null, onFieldSelect = null;
  let handSelectMode = null; // 'single' | 'multi'
  let handCandidateNames = null;
  const pd = _pendingDecision;
  if (pd) {
    const fieldTypes = ['cheerTarget','lifeCheerTarget','promoteCenter','supportTarget'];
    if (fieldTypes.includes(pd.type)) {
      selectableIds = new Set(pd.candidates.map(h => h.id));
      onFieldSelect = (h) => {
        _pendingDecision = null;
        const acts = $('#bvActions'); acts.style.display = 'none';
        document.querySelectorAll('.bv-slot.selectable').forEach(s => s.classList.remove('selectable'));
        document.querySelectorAll('.bv-field-prompt').forEach(e => e.remove());
        pd.driver.submitChoice(h.id);
      };
    }
    if (pd.type === 'setupCenter') {
      handSelectMode = 'single';
      handCandidateNames = new Set(pd.candidates.map(c => c.n));
    }
    if (pd.type === 'setupBack') {
      handSelectMode = 'multi';
      handCandidateNames = new Set(pd.candidates.map(c => c.n));
    }
  }

  // Opponent half
  $('#bvOpInfo').innerHTML = renderNameBar(op, true);
  $('#bvOpLeft').innerHTML = renderZoneLeft(op);
  $('#bvOpRight').innerHTML = renderZoneRight(op);
  renderFrontRow($('#bvOpFront'), op, false, null, null);
  const opBack = $('#bvOpBack'); opBack.innerHTML = '';
  op.back.forEach(h => { if (h) opBack.appendChild(renderSlot(h, false)); });

  // My half
  $('#bvMeInfo').innerHTML = renderNameBar(me, false);
  $('#bvMeLeft').innerHTML = renderZoneLeft(me);
  $('#bvMeRight').innerHTML = renderZoneRight(me);
  renderFrontRow($('#bvMeFront'), me, true, selectableIds, onFieldSelect);
  const meBack = $('#bvMeBack'); meBack.innerHTML = '';
  me.back.forEach(h => {
    if (!h) return;
    const isSel = selectableIds && selectableIds.has(h.id);
    meBack.appendChild(renderSlot(h, isSel, isSel ? onFieldSelect : null));
  });

  // Field prompt overlay for field-card selection
  document.querySelectorAll('.bv-field-prompt').forEach(e => e.remove());
  if (selectableIds && pd) {
    const prompt = el('div','bv-field-prompt', pd.prompt || '対象を選択');
    $('#bvMeFront').parentElement.style.position = 'relative';
    $('#bvMeFront').parentElement.appendChild(prompt);
  }

  // Hand
  const hand = $('#bvHand'); hand.innerHTML = '';
  const setupBackSelected = pd && pd.type === 'setupBack' ? (pd._selected || (pd._selected = [])) : null;
  if (Array.isArray(me.hand)) {
    me.hand.forEach(c => {
      const img = el('img','hand-card');
      img.src = c.img || '';
      img.alt = c.nm;
      img.title = `${c.nm}（${c.bl || c.t}）`;
      img.loading = 'lazy';
      const isCandidate = handCandidateNames && handCandidateNames.has(c.n);
      if (isCandidate) img.classList.add('selectable');
      if (setupBackSelected && setupBackSelected.includes(c.n)) {
        img.classList.add('selected');
        img.classList.remove('selectable');
      }
      if (isCandidate && handSelectMode === 'single') {
        img.onclick = (e) => {
          e.stopPropagation();
          _pendingDecision = null;
          const acts = $('#bvActions'); acts.style.display = 'none';
          document.querySelectorAll('.hand-card.selectable').forEach(s => s.classList.remove('selectable'));
          pd.driver.submitChoice(c.n);
        };
      } else if (isCandidate && handSelectMode === 'multi') {
        img.onclick = (e) => {
          e.stopPropagation();
          const idx = setupBackSelected.indexOf(c.n);
          if (idx >= 0) { setupBackSelected.splice(idx, 1); }
          else if (setupBackSelected.length < 3) { setupBackSelected.push(c.n); }
          if (pd._updateConfirm) pd._updateConfirm();
          // Re-render to update visual state
          renderBattleState(snap, meKey);
        };
      }
      attachPopupEvents(img, c.n, null);
      hand.appendChild(img);
    });
  }

  // Log
  const logEl = $('#bvLog');
  const lines = snap.log.slice(-30);
  logEl.innerHTML = lines.map(l => `<div class="log-line ${l.cls||''}">${esc(l.t)}</div>`).join('');
  logEl.scrollTop = logEl.scrollHeight;
}

function showDecision(decision, driver, meKey) {
  const acts = $('#bvActions');
  acts.style.display = '';
  acts.innerHTML = '';
  const prompt = el('div','prompt',esc(decision.prompt || '選択してください'));
  acts.appendChild(prompt);
  const list = el('div','act-list');
  acts.appendChild(list);

  const submit = (choice) => {
    _pendingDecision = null;
    acts.style.display = 'none';
    document.querySelectorAll('.bv-slot.selectable').forEach(s => s.classList.remove('selectable'));
    document.querySelectorAll('.hand-card.selectable,.hand-card.selected').forEach(s => {
      s.classList.remove('selectable','selected');
    });
    document.querySelectorAll('.bv-field-prompt').forEach(e => e.remove());
    driver.submitChoice(choice);
  };

  // Card-selection types: use direct tap on field/hand cards
  const fieldSelectTypes = ['cheerTarget','lifeCheerTarget','promoteCenter','supportTarget'];
  const handSelectTypes = ['setupCenter','setupBack'];

  if (fieldSelectTypes.includes(decision.type)) {
    // Store pending decision and re-render so cards become selectable
    _pendingDecision = { type: decision.type, candidates: decision.candidates, driver, prompt: decision.prompt };
    prompt.textContent = (decision.prompt || '対象を選択') + '（カードをタップ）';
    const snap = HoloEngine.snapshot(driver.game);
    renderBattleState(snap, meKey);
    return;
  }

  if (handSelectTypes.includes(decision.type)) {
    _pendingDecision = { type: decision.type, candidates: decision.candidates, driver, prompt: decision.prompt };
    if (decision.type === 'setupCenter') {
      prompt.textContent = (decision.prompt || 'センターを選択') + '（手札をタップ）';
    } else {
      prompt.textContent = (decision.prompt || 'バックを選択') + '（手札をタップして選択）';
      const confirmBtn = el('button','act-btn','決定（0枚）');
      confirmBtn.className += ' done-btn';
      confirmBtn.onclick = () => submit(_pendingDecision._selected || []);
      list.appendChild(confirmBtn);
      // Update confirm button text when selection changes
      _pendingDecision._updateConfirm = () => {
        const sel = _pendingDecision._selected || [];
        confirmBtn.textContent = sel.length ? `決定（${sel.length}枚）` : 'スキップ';
        confirmBtn.className = 'act-btn done-btn' + (sel.length ? '' : ' end');
      };
    }
    const snap = HoloEngine.snapshot(driver.game);
    renderBattleState(snap, meKey);
    return;
  }

  // Button-based types: mulligan, mainAction, artChoice
  switch (decision.type) {
    case 'mulligan': {
      const snap = HoloEngine.snapshot(driver.game);
      const meSnap = snap[meKey];
      const handCards = meSnap.hand || [];
      const handDiv = el('div','mulligan-hand');
      handDiv.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin:8px 0';
      handCards.forEach(c => {
        const img = document.createElement('img');
        img.src = c.img || '';
        img.alt = c.nm || c.n;
        img.style.cssText = 'width:60px;border-radius:4px;border:1px solid #555';
        const wrap = el('div','');
        wrap.appendChild(img);
        const label = el('div','',esc(c.nm||c.n));
        label.style.cssText = 'font-size:10px;text-align:center;max-width:60px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis';
        wrap.appendChild(label);
        handDiv.appendChild(wrap);
      });
      list.appendChild(handDiv);
      const yesBtn = el('button','act-btn end','引き直す');
      yesBtn.onclick = () => submit('yes');
      list.appendChild(yesBtn);
      const noBtn = el('button','act-btn','このまま進める');
      noBtn.onclick = () => submit('no');
      list.appendChild(noBtn);
      break;
    }
    case 'mainAction': {
      decision.actions.forEach(a => {
        const lbl = a.label || a.act;
        const btn = el('button','act-btn' + (a.act === 'endMain' ? ' end' : ''), esc(lbl));
        btn.onclick = () => submit(a);
        list.appendChild(btn);
      });
      break;
    }
    case 'artChoice': {
      decision.arts.forEach(a => {
        let costStr = '';
        if (a.cost && typeof a.cost === 'object' && !Array.isArray(a.cost)) {
          const parts = [];
          if (a.cost.colors) Object.entries(a.cost.colors).forEach(([c, n]) => { for (let i = 0; i < n; i++) parts.push(c); });
          const specified = parts.length;
          if (a.cost.total > specified) { for (let i = 0; i < a.cost.total - specified; i++) parts.push('◇'); }
          costStr = parts.join('') || (a.cost.any ? '◇'.repeat(a.cost.any) : '0');
        } else if (Array.isArray(a.cost)) {
          costStr = a.cost.map(c => c.join ? c.join('') : c).join('');
        }
        const btn = el('button','act-btn',`⚔ アーツ${a.idx+1}（威力${a.power}／コスト${costStr}）`);
        btn.onclick = () => submit(a.idx);
        list.appendChild(btn);
      });
      const skipBtn = el('button','act-btn end','パス（攻撃しない）');
      skipBtn.onclick = () => submit('skip');
      list.appendChild(skipBtn);
      break;
    }
    case 'deckSearch': {
      const info = el('div','', `🔍 山札サーチ: ${decision.count}枚選択`);
      info.style.cssText = 'margin-bottom:8px;font-weight:bold;color:#ffca28';
      list.appendChild(info);
      list.appendChild(buildCardPicker(decision.candidates, '#ffca28', submit));
      break;
    }
    case 'revealChoice': {
      const info = el('div','', `📖 公開カードから${decision.count}枚選択`);
      info.style.cssText = 'margin-bottom:8px;font-weight:bold;color:#4fc3f7';
      list.appendChild(info);
      list.appendChild(buildCardPicker(decision.candidates, '#4fc3f7', submit));
      break;
    }
  }
}

/* Card-image picker used by deckSearch / revealChoice decisions.
   Falls back to a text tile when a candidate has no image URL. */
function buildCardPicker(candidates, accent, submit) {
  const grid = el('div','bv-pick-grid');
  candidates.forEach(c => {
    const tile = el('div','bv-pick-card');
    if (c.img) {
      const img = el('img','');
      img.src = c.img;
      img.alt = c.nm;
      img.loading = 'lazy';
      // Remote art may 404 — degrade to the name tile instead of a broken-image icon
      img.onerror = () => { img.replaceWith(el('div','bv-pick-ph', esc(c.nm))); };
      tile.appendChild(img);
    } else {
      tile.appendChild(el('div','bv-pick-ph', esc(c.nm)));
    }
    const typeLabel = c.t === 'holomen' ? (c.bl || 'Debut') : (c.t === 'support' ? 'サポート' : c.t);
    const cap = el('div','bv-pick-cap');
    cap.innerHTML = `<span class="nm">${esc(c.nm)}</span><span class="ty">${esc(typeLabel)}</span>`;
    tile.appendChild(cap);
    if (c.dup > 1) tile.appendChild(el('div','bv-pick-dup', `×${c.dup}`));
    tile.style.setProperty('--pick-accent', accent);
    tile.onclick = () => { hideCardPopup(); submit(c.idx); };
    if (c.n) attachPopupEvents(tile, c.n, null);
    grid.appendChild(tile);
  });
  return grid;
}

function showBattleResult(result, meKey) {
  const field = $('#bvField');
  const overlay = el('div','bv-result');
  const won = result.winner === meKey;
  overlay.innerHTML = `
    <h2 class="${won ? 'win-a' : 'win-b'}">${won ? '🎉 勝利！' : '😢 敗北…'}</h2>
    <div class="detail">${result.turns}ターン・${esc(result.reason || '')}</div>
    <button class="btn primary" id="bvClose">閉じる</button>`;
  field.appendChild(overlay);
  overlay.querySelector('#bvClose').onclick = () => closeBattle();
}

function closeBattle() {
  if (_battleDriver) { _battleDriver.stop(); _battleDriver = null; }
  $('#battleView').classList.remove('open');
  const res = $('#bvField').querySelector('.bv-result');
  if (res) res.remove();
  $('#bvActions').style.display = 'none';
}

/* --- battle animations --- */
function findSlotByHoloId(id) {
  const slots = document.querySelectorAll('.bv-slot[data-holo-id]');
  for (const s of slots) if (s.dataset.holoId === String(id)) return s;
  return null;
}
function animateSlot(id, cls, duration) {
  const slot = findSlotByHoloId(id);
  if (!slot) return;
  slot.classList.add(cls);
  setTimeout(() => slot.classList.remove(cls), duration || 600);
}
function showDmgPopup(id, dmg) {
  const slot = findSlotByHoloId(id);
  if (!slot) return;
  const pop = el('div','bv-dmg-popup', `-${dmg}`);
  slot.style.position = 'relative';
  slot.appendChild(pop);
  setTimeout(() => pop.remove(), 1200);
}
function showEventToast(text, duration) {
  const field = $('#bvField');
  const toast = el('div','bv-event-toast', text);
  field.style.position = 'relative';
  field.appendChild(toast);
  setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 300); }, duration || 1200);
}
function handleBattleEvent(d, meKey) {
  if (!d || !d.event) return;
  switch (d.event) {
    case 'artHit':
      animateSlot(d.attacker, 'anim-attack', 500);
      setTimeout(() => {
        animateSlot(d.target, 'anim-damage', 600);
        showDmgPopup(d.target, d.dmg);
      }, 200);
      showEventToast(`⚔ ${d.attackerName} → ${d.targetName}  ${d.dmg}ダメージ`, 1500);
      break;
    case 'bloom':
      animateSlot(d.holoId, 'anim-bloom', 700);
      showEventToast(`🌸 ${d.name} にブルーム！`, 1200);
      break;
    case 'collab':
      animateSlot(d.holoId, 'anim-collab', 500);
      showEventToast(`🤝 ${d.name} コラボ！`, 1000);
      break;
    case 'downed':
      showEventToast(`💥 ${d.msg}`, 1500);
      break;
    case 'supportUsed':
      showEventToast(`📜 ${d.name} 発動！`, 1000);
      break;
    case 'turnStart':
      showEventToast(`ターン ${d.turn}`, 800);
      break;
  }
}

  $('#bvOpFront').innerHTML = '';
  $('#bvOpBack').innerHTML = '';
  $('#bvOpRight').innerHTML = '';
  $('#bvMeInfo').innerHTML = '';
  $('#bvMeLeft').innerHTML = '';
  $('#bvMeFront').innerHTML = '';
  $('#bvMeBack').innerHTML = '';
  $('#bvMeRight').innerHTML = '';
  const res = $('#bvField').querySelector('.bv-result');
  if (res) res.remove();

  const driver = new HoloEngine.BattleDriver(game, meKey, {

  });

}

/* ===================== card popup (battle view) ===================== */
const _popup = $('#cardPopup');
const _popupImg = $('#cpImg');
const _popupBody = $('#cpBody');
let _popupTimer = null;

function buildPopupHTML(cardNum, holo) {
  const c = BYNUM.get(cardNum);
  if (!c) return '';
  const tx = c.tx || {};
  let html = `<div class="cp-name">${esc(c.nm)}</div>`;
  html += `<div class="cp-meta">`;
  html += `<span>${c.n}</span>`;
  if (c.bl) html += `<span>${c.bl}</span>`;
  if (c.t === 'oshi') html += `<span>推しホロメン</span>`;
  else if (c.t === 'support') html += `<span>サポート${c.st ? '・'+c.st : ''}</span>`;
  else if (c.t === 'holomen') html += `<span>ホロメン</span>`;
  if (c.c && c.c.length) html += `<span>${c.c.join('/')}</span>`;
  if (c.bt) html += `<span>バトン${c.bt}</span>`;
  html += `</div>`;
  if (holo || c.hp) {
    html += `<div class="cp-stats">`;
    if (c.hp) html += `<span class="hp">HP ${c.hp}</span>`;
    if (holo && holo.dmg) html += `<span class="dmg">ダメージ ${holo.dmg}</span>`;
    if (holo && holo.cheer) html += `<span class="cheer">エール ${holo.cheer.length}枚</span>`;
    if (c.lf) html += `<span>LIFE ${c.lf}</span>`;
    html += `</div>`;
  }
  let txHtml = '';
  const addTx = (lab, val) => { if (val) txHtml += `<span class="cp-label">${lab}</span>${esc(val)}\n`; };
  addTx('推しスキル', tx.o);
  addTx('SP推しスキル', tx.s);
  if (tx.k) tx.k.forEach(k => addTx('キーワード', k));
  if (tx.a) tx.a.forEach(a => addTx('アーツ', a));
  addTx('能力テキスト', tx.b);
  if (txHtml) html += `<div class="cp-text">${txHtml}</div>`;
  if (holo && holo.attachments && holo.attachments.length) {
    html += `<div class="cp-attach">`;
    holo.attachments.forEach(att => {
      const ac = BYNUM.get(att.n);
      html += `<span class="att-name">📎 ${esc(att.nm || (ac && ac.nm) || att.n)}</span> `;
    });
    html += `</div>`;
  }
  return html;
}

function showCardPopup(cardNum, holo, anchorEl) {
  const c = BYNUM.get(cardNum);
  if (!c) return;
  _popupImg.src = c.img || '';
  _popupImg.alt = c.nm;
  _popupImg.style.display = c.img ? '' : 'none';
  _popupBody.innerHTML = buildPopupHTML(cardNum, holo);
  _popup.classList.add('on');
  requestAnimationFrame(() => positionPopup(anchorEl));
}

function positionPopup(anchor) {
  const r = anchor.getBoundingClientRect();
  const pw = _popup.offsetWidth, ph = _popup.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = r.right + 8;
  if (left + pw > vw) left = r.left - pw - 8;
  if (left < 4) left = 4;
  let top = r.top;
  if (top + ph > vh) top = vh - ph - 4;
  if (top < 4) top = 4;
  _popup.style.left = left + 'px';
  _popup.style.top = top + 'px';
}

function hideCardPopup() {
  clearTimeout(_popupTimer);
  _popupTimer = null;
  _popup.classList.remove('on');
}

function attachPopupEvents(el, cardNum, holo) {
  el.addEventListener('mouseenter', () => {
    clearTimeout(_popupTimer);
    _popupTimer = setTimeout(() => showCardPopup(cardNum, holo, el), 350);
  });
  el.addEventListener('mouseleave', () => hideCardPopup());
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    clearTimeout(_popupTimer);
    showCardPopup(cardNum, holo, el);
    const dismiss = () => { hideCardPopup(); document.removeEventListener('click', dismiss); };
    setTimeout(() => document.addEventListener('click', dismiss), 50);
  });
  el.addEventListener('touchstart', (e) => {
    _popupTimer = setTimeout(() => {
      e.preventDefault();
      showCardPopup(cardNum, holo, el);
      const dismiss = () => { hideCardPopup(); document.removeEventListener('touchstart', dismiss); };
      setTimeout(() => document.addEventListener('touchstart', dismiss), 50);
    }, 400);
  }, {passive: false});
  el.addEventListener('touchend', () => { if (_popupTimer) { clearTimeout(_popupTimer); _popupTimer = null; } });
}
