     <div class="field"><label>または合言葉で参加</label><input id="bJoinCode" placeholder="例: ABC234" maxlength="6" autocapitalize="characters"></div>
     <div class="row"><button class="btn" id="bJoin">🚪 参加する</button><button class="btn ghost" onclick="closeDlg()">閉じる</button></div>
     <div id="bOnStatus" class="mini-note"></div>
   </div>
   <div id="bModeAI">
     <p class="mini-note">あなたがプレイヤーAとしてAIと対戦します。すべての選択を自分で行います。</p>
     <div class="field"><label>あなたのデッキ</label><select id="bAI_A">${curOpt}${optsFrom(saved)}</select></div>
     <div class="field"><label>AI（対戦相手）</label><select id="bAI_B">${optsFrom(saved)}${curOpt}</select></div>
     <div class="row"><button class="btn primary" id="bStartAI">⚔ 対戦開始</button><button class="btn ghost" onclick="closeDlg()">閉じる</button></div>
   </div>
   <div id="bModeSim" style="display:none">
     <p class="mini-note">実際に盤面を持ってルール通りに自動対戦させ、勝率を推定します。</p>
     <div class="field"><label>デッキ A</label><select id="bA">${curOpt}${optsFrom(saved)}</select></div>
     <div class="field"><label>デッキ B（対戦相手）</label><select id="bB">${optsFrom(saved)}${curOpt}</select></div>
     <div class="field"><label>試行回数</label><select id="bN"><option value="200">200戦</option><option value="500" selected>500戦</option><option value="2000">2000戦</option></select></div>
     <div class="row"><button class="btn primary" id="bRun">対戦させる</button><button class="btn ghost" onclick="closeDlg()">閉じる</button></div>
     <div id="bResult"></div>
   </div>`);
  const getDeck=(v)=> v==='cur'?deckObj():getSaved()[Number(v)];
  // mode toggle
  $('#bMode').onchange=()=>{
    const m=$('#bMode').value;
    $('#bModeAI').style.display=m==='ai'?'':'none';
    $('#bModeOnline').style.display=m==='online'?'':'none';
    $('#bModeSim').style.display=m==='sim'?'':'none';
  };
  // online match
  $('#bHost').onclick=()=>{
    const d=getDeck($('#bOn_deck').value);
    if(!d){toast('デッキを選択してください');return;}
    hostOnlineMatch(d);
  };
  $('#bCopyCode').onclick=()=>{
    const code=$('#bRoomCode').textContent;
    navigator.clipboard?.writeText(code).then(()=>toast('合言葉をコピーしました'),()=>{});
  };
  $('#bJoin').onclick=()=>{
    const d=getDeck($('#bOn_deck').value);
    if(!d){toast('デッキを選択してください');return;}
    const code=($('#bJoinCode').value||'').trim().toUpperCase();
    if(code.length!==6){toast('6文字の合言葉を入力してください');return;}
    joinOnlineMatch(code,d);
  };
  // 既定でBを別デッキに
  if(saved.length && curValid){ $('#bB').value='0'; $('#bAI_B').value='0'; }
  // AI battle start
  $('#bStartAI').onclick=()=>{
    const dA=getDeck($('#bAI_A').value), dB=getDeck($('#bAI_B').value);
    if(!dA||!dB){toast('デッキを選択してください');return;}
    closeDlg();
    startInteractiveBattle(dA,dB);
  };
  $('#bRun').onclick=()=>{
    const dA=getDeck($('#bA').value), dB=getDeck($('#bB').value);
    if(!dA||!dB){toast('デッキを選択してください');return;}
    if(JSON.stringify(dA)===JSON.stringify(dB)){toast('同じデッキ同士です（別のデッキを選んでください）');}
    const R=runBattle(dA,dB,Number($('#bN').value));
    const pa=Math.round(R.wa/R.games*100), pb=100-pa;
    const statRow=(lab,a,b,fmt=x=>x)=>`<div class="stat"><span>${lab}</span><span>${fmt(a)}</span></div>`;
    const card=(D,cls)=>`<div class="vscard ${cls}"><h4>${cls==='a'?'🟦':'🟪'} ${esc(D.name)}</h4>
       <div class="oshi">推し: ${esc(D.oshiName)}・LIFE ${D.life}</div>
       ${statRow('Debut火力', Math.round(D.lvlAtk.Debut))}
       ${statRow('1st火力', Math.round(D.lvlAtk['1st']))}
       ${statRow('2nd火力', Math.round(D.lvlAtk['2nd']))}
       ${statRow('平均HP(1st)', Math.round(D.lvlHP['1st']))}
       ${statRow('エール適合', Math.round(D.cheerFit*100)+'%')}</div>`;
    const logHtml=R.log.map(l=>`<div class="${l.cls}">${esc(l.t)}</div>`).join('');
    $('#bResult').innerHTML=`
      <div class="vs">${card(R.A,'a')}<div class="vsmid">VS</div>${card(R.B,'b')}</div>
      <div class="simmeta"><span>${R.games}戦の勝率</span><span>平均 ${R.avgTurn} ターン</span></div>
      <div class="winbar"><div class="wa" style="flex:${Math.max(pa,6)}">${esc(R.A.name)} ${pa}%</div><div class="wb" style="flex:${Math.max(pb,6)}">${pb}% ${esc(R.B.name)}</div></div>
      <div class="mini-note">サンプル対戦ログ（1戦）:</div>
      <div class="battlelog">${logHtml}</div>`;
  };
};

/* ===================== interactive battle ===================== */
let _battleDriver = null;
let _pendingDecision = null;
// Last rendered snapshot. The online guest has no engine of its own, so decision
// rendering reads the board from here rather than re-snapshotting a live game.
let _lastSnap = null;

function colorDot(col) {
  return `<span class="cdot" style="background:${COLORVAR[col]||'var(--c-none)'}"></span>`;
}

function renderSlot(h, selectable, onClick) {
  if (!h) { const d = el('div','bv-slot'); d.innerHTML='<div class="bv-slot-empty"></div>'; return d; }
  const hp = h.hp || 1, dmg = h.dmg || 0, cur = Math.max(0, hp - dmg), pct = Math.round(cur / hp * 100);
  const cls = pct > 50 ? '' : pct > 20 ? ' warn' : ' crit';
  const d = el('div', 'bv-slot' + (selectable ? ' selectable' : ''));
  if (h.id != null) d.dataset.holoId = h.id;
  d.innerHTML = `${h.img ? `<img class="card-thumb" src="${h.img}" alt="${esc(h.nm)}" loading="lazy">` : `<div class="card-thumb" style="background:var(--bg3);display:grid;place-items:center;font-size:9px">${esc(h.nm)}</div>`}
    <div class="hp-bar"><div class="hp-fill${cls}" style="width:${pct}%"></div></div>
    <div class="cheer-dots">${(h.cheer||[]).map(colorDot).join('')}</div>
    <span class="slot-label">${esc(h.nm)}</span>
    ${dmg ? `<span class="dmg-text">-${dmg}</span>` : ''}
    ${h.buffArt ? `<span class="buff-text">+${h.buffArt}</span>` : ''}`;
  if (onClick) d.onclick = () => onClick(h);
  attachPopupEvents(d, h.n, h);
  return d;
}

function renderNameBar(p, isOp) {
  const pipHtml = Array.from({length: p.oshi.lf || 0}, (_, i) =>
    `<span class="pip${i >= p.life ? ' lost' : ''}"></span>`).join('');
  return `<span class="name">${isOp ? '🟪 ' : '🟦 '}${esc(p.name)}</span>
    <span class="life-pips">${pipHtml}</span>`;
}

function renderZoneStack(count, cls) {
  if (count <= 0) {
    return `<div class="zone-stack-wrap ${cls} empty"><div class="zs-card zs-c0"></div></div>`;
  }
  const n = Math.min(count, 3);
  let cards = '';
  for (let i = n - 1; i >= 0; i--) {
    cards += `<div class="zs-card zs-c${i}"><div class="zs-diamond"></div></div>`;
  }
  return `<div class="zone-stack-wrap ${cls}">${cards}<span class="zs-badge">${count}</span></div>`;
}

function renderZoneLeft(p) {
  return `${renderZoneStack(p.life, 'life')}
    <div class="zone-label">ライフ</div>
    ${renderZoneStack(p.cheerDeckCount, 'cheer-pile')}
    <div class="zone-label">エール</div>`;
}

function renderZoneRight(p) {
  return `${renderZoneStack(p.holoPowerCount, 'hp-zone')}
    <div class="zone-label">ホロパワー</div>
    ${renderZoneStack(p.deckCount, 'deck-zone')}
    <div class="zone-label">デッキ</div>
    ${renderZoneStack(p.archiveCount, 'archive-zone')}
    <div class="zone-label">アーカイブ</div>`;
}

function renderOshiSlot(oshi) {
  const d = el('div', 'bv-slot oshi-slot');
  d.innerHTML = `${oshi.img ? `<img class="card-thumb" src="${oshi.img}" alt="${esc(oshi.nm)}" loading="lazy">` : `<div class="card-thumb" style="background:var(--bg3);display:grid;place-items:center;font-size:8px">${esc(oshi.nm)}</div>`}
    <span class="slot-label">${esc(oshi.nm)}</span>`;
  attachPopupEvents(d, oshi.n, null);
  return d;
}

function renderFrontRow(container, p, isMe, selectableIds, onSelect) {
  container.innerHTML = '';
  const isSelectable = (h) => h && selectableIds && selectableIds.has(h.id);
  const collabSlot = p.collab ? renderSlot(p.collab, isSelectable(p.collab), isSelectable(p.collab) ? onSelect : null) : (() => { const e = el('div','bv-slot'); e.innerHTML = '<div class="bv-slot-empty">コラボ</div>'; return e; })();
  const centerSlot = p.center ? renderSlot(p.center, isSelectable(p.center), isSelectable(p.center) ? onSelect : null) : (() => { const e = el('div','bv-slot'); e.innerHTML = '<div class="bv-slot-empty">センター</div>'; return e; })();
  const oshiSlot = renderOshiSlot(p.oshi);
  if (isMe) {
    collabSlot.dataset.drop = 'collab';
    centerSlot.dataset.drop = 'center';
    container.appendChild(collabSlot);
    container.appendChild(centerSlot);
    container.appendChild(oshiSlot);
  } else {
    container.appendChild(oshiSlot);
    container.appendChild(centerSlot);
    container.appendChild(collabSlot);
  }
}

function renderBattleState(snap, meKey) {
  _lastSnap = snap;
  const me = snap[meKey], op = snap[meKey === 'A' ? 'B' : 'A'];
  const phaseMap = {reset:'リセット',draw:'手札',cheer:'エール',main:'メイン',art:'パフォーマンス'};
  $('#bvTurn').textContent = `ターン ${snap.turn || 0}`;
  $('#bvPhase').textContent = snap.phase ? `[${phaseMap[snap.phase] || snap.phase}ステップ]` : '';

  // Determine which field cards are selectable from _pendingDecision
  let selectableIds = null, onFieldSelect = null;
  let handSelectMode = null; // 'single' | 'multi'
  let handCandidateNames = null;
  const pd = _pendingDecision;
  if (pd) {
    const fieldTypes = ['cheerTarget','lifeCheerTarget','promoteCenter','supportTarget'];
    if (fieldTypes.includes(pd.type)) {
      selectableIds = new Set(pd.candidates.map(h => h.id));
      onFieldSelect = (h) => {
        _pendingDecision = null;
        const acts = $('#bvActions'); acts.style.display = 'none';
        document.querySelectorAll('.bv-slot.selectable').forEach(s => s.classList.remove('selectable'));
        document.querySelectorAll('.bv-field-prompt').forEach(e => e.remove());
        pd.driver.submitChoice(h.id);
      };
    }
    if (pd.type === 'setupCenter') {
      handSelectMode = 'single';
      handCandidateNames = new Set(pd.candidates.map(c => c.n));
    }
    if (pd.type === 'setupBack') {
      handSelectMode = 'multi';
      handCandidateNames = new Set(pd.candidates.map(c => c.n));
    }
  }

  // Opponent half
  $('#bvOpInfo').innerHTML = renderNameBar(op, true);
  $('#bvOpLeft').innerHTML = renderZoneLeft(op);
  $('#bvOpRight').innerHTML = renderZoneRight(op);
  renderFrontRow($('#bvOpFront'), op, false, null, null);
  const opBack = $('#bvOpBack'); opBack.innerHTML = '';
  op.back.forEach(h => { if (h) opBack.appendChild(renderSlot(h, false)); });

  // My half
  $('#bvMeInfo').innerHTML = renderNameBar(me, false);
  $('#bvMeLeft').innerHTML = renderZoneLeft(me);
  $('#bvMeRight').innerHTML = renderZoneRight(me);
  renderFrontRow($('#bvMeFront'), me, true, selectableIds, onFieldSelect);
  const meBack = $('#bvMeBack'); meBack.innerHTML = '';
  // During the main phase a back holomen can be dragged to the collab or center slot
  const mainActions = (pd && pd.type === 'mainAction') ? pd.actions : null;
  me.back.forEach(h => {
    if (!h) return;
    const isSel = selectableIds && selectableIds.has(h.id);
    const slot = renderSlot(h, isSel, isSel ? onFieldSelect : null);
    slot.dataset.drop = 'holo';
    if (mainActions && mainActions.some(a => (a.act === 'collab' || a.act === 'baton') && a.holoId === h.id)) {
      dndMakeDraggable(slot, { kind: 'holo', id: h.id }, mainActions);
    }
    meBack.appendChild(slot);
  });

  // Field prompt overlay for field-card selection
  document.querySelectorAll('.bv-field-prompt').forEach(e => e.remove());
  if (selectableIds && pd) {
    const prompt = el('div','bv-field-prompt', pd.prompt || '対象を選択');
    $('#bvMeFront').parentElement.style.position = 'relative';
    $('#bvMeFront').parentElement.appendChild(prompt);
  }

  // Hand
  const hand = $('#bvHand'); hand.innerHTML = '';
  const setupBackSelected = pd && pd.type === 'setupBack' ? (pd._selected || (pd._selected = [])) : null;
  if (Array.isArray(me.hand)) {
    me.hand.forEach((c, handIdx) => {
      const img = el('img','hand-card');
      img.src = c.img || '';
      img.alt = c.nm;
      img.title = `${c.nm}（${c.bl || c.t}）`;
      img.loading = 'lazy';
      if (mainActions && mainActions.some(a => a.handIdx === handIdx)) {
        dndMakeDraggable(img, { kind: 'hand', idx: handIdx }, mainActions);
      }
      const isCandidate = handCandidateNames && handCandidateNames.has(c.n);
      if (isCandidate) img.classList.add('selectable');
      if (setupBackSelected && setupBackSelected.includes(c.n)) {
        img.classList.add('selected');
        img.classList.remove('selectable');
      }
      if (isCandidate && handSelectMode === 'single') {
        img.onclick = (e) => {
          e.stopPropagation();
          _pendingDecision = null;
          const acts = $('#bvActions'); acts.style.display = 'none';
          document.querySelectorAll('.hand-card.selectable').forEach(s => s.classList.remove('selectable'));
          pd.driver.submitChoice(c.n);
        };
      } else if (isCandidate && handSelectMode === 'multi') {
        img.onclick = (e) => {
          e.stopPropagation();
          const idx = setupBackSelected.indexOf(c.n);
          if (idx >= 0) { setupBackSelected.splice(idx, 1); }
          else if (setupBackSelected.length < 3) { setupBackSelected.push(c.n); }
          if (pd._updateConfirm) pd._updateConfirm();
          // Re-render to update visual state
          renderBattleState(snap, meKey);
        };
      }
      attachPopupEvents(img, c.n, null);
      hand.appendChild(img);
    });
  }

  // Log
  const logEl = $('#bvLog');
  const lines = snap.log.slice(-30);
  logEl.innerHTML = lines.map(l => `<div class="log-line ${l.cls||''}">${esc(l.t)}</div>`).join('');
  logEl.scrollTop = logEl.scrollHeight;
}

function showDecision(decision, driver, meKey) {
  const acts = $('#bvActions');
  acts.style.display = '';
  acts.innerHTML = '';
  const prompt = el('div','prompt',esc(decision.prompt || '選択してください'));
  acts.appendChild(prompt);
  const list = el('div','act-list');
  acts.appendChild(list);

  const submit = (choice) => {
    _pendingDecision = null;
    acts.style.display = 'none';
    document.querySelectorAll('.bv-slot.selectable').forEach(s => s.classList.remove('selectable'));
    document.querySelectorAll('.hand-card.selectable,.hand-card.selected').forEach(s => {
      s.classList.remove('selectable','selected');
    });
    document.querySelectorAll('.bv-field-prompt').forEach(e => e.remove());
    driver.submitChoice(choice);
  };

  // Card-selection types: use direct tap on field/hand cards
  const fieldSelectTypes = ['cheerTarget','lifeCheerTarget','promoteCenter','supportTarget'];
  const handSelectTypes = ['setupCenter','setupBack'];

  if (fieldSelectTypes.includes(decision.type)) {
    // Store pending decision and re-render so cards become selectable
    _pendingDecision = { type: decision.type, candidates: decision.candidates, driver, prompt: decision.prompt };
    prompt.textContent = (decision.prompt || '対象を選択') + '（カードをタップ）';
    if (_lastSnap) renderBattleState(_lastSnap, meKey);
    return;
  }

  if (handSelectTypes.includes(decision.type)) {
    _pendingDecision = { type: decision.type, candidates: decision.candidates, driver, prompt: decision.prompt };
    if (decision.type === 'setupCenter') {
      prompt.textContent = (decision.prompt || 'センターを選択') + '（手札をタップ）';
    } else {
      prompt.textContent = (decision.prompt || 'バックを選択') + '（手札をタップして選択）';
      const confirmBtn = el('button','act-btn','決定（0枚）');
      confirmBtn.className += ' done-btn';
      confirmBtn.onclick = () => submit(_pendingDecision._selected || []);
      list.appendChild(confirmBtn);
      // Update confirm button text when selection changes
      _pendingDecision._updateConfirm = () => {
        const sel = _pendingDecision._selected || [];
        confirmBtn.textContent = sel.length ? `決定（${sel.length}枚）` : 'スキップ';
        confirmBtn.className = 'act-btn done-btn' + (sel.length ? '' : ' end');
      };
    }
    if (_lastSnap) renderBattleState(_lastSnap, meKey);
    return;
  }

  // Button-based types: mulligan, mainAction, artChoice
  switch (decision.type) {
    case 'mulligan': {
      const meSnap = (_lastSnap && _lastSnap[meKey]) || { hand: [] };
      const handCards = Array.isArray(meSnap.hand) ? meSnap.hand : [];
      const handDiv = el('div','mulligan-hand');
      handDiv.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin:8px 0';
      handCards.forEach(c => {
        const img = document.createElement('img');
        img.src = c.img || '';
        img.alt = c.nm || c.n;
        img.style.cssText = 'width:60px;border-radius:4px;border:1px solid #555';
        const wrap = el('div','');
        wrap.appendChild(img);
        const label = el('div','',esc(c.nm||c.n));
        label.style.cssText = 'font-size:10px;text-align:center;max-width:60px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis';
        wrap.appendChild(label);
        handDiv.appendChild(wrap);
      });
      list.appendChild(handDiv);
      const yesBtn = el('button','act-btn end','引き直す');
      yesBtn.onclick = () => submit('yes');
      list.appendChild(yesBtn);
      const noBtn = el('button','act-btn','このまま進める');
      noBtn.onclick = () => submit('no');
      list.appendChild(noBtn);
      break;
    }
    case 'mainAction': {
      decision.actions.forEach(a => {
        const lbl = a.label || a.act;
        const btn = el('button','act-btn' + (a.act === 'endMain' ? ' end' : ''), esc(lbl));
        btn.onclick = () => submit(a);
        list.appendChild(btn);
      });
      // Also expose these actions as drag targets on the board; the buttons above
      // remain the equivalent fallback.
      const draggable = decision.actions.some(a => a.handIdx != null || a.act === 'collab' || a.act === 'baton');
      if (draggable) {
        _pendingDecision = { type: 'mainAction', actions: decision.actions, driver, prompt: decision.prompt };
        acts.appendChild(el('div','bv-drag-hint','手札やバックのカードを盤面にドラッグしてもアクションできます'));
        if (_lastSnap) renderBattleState(_lastSnap, meKey);
      }
      break;
    }
    case 'artChoice': {
      decision.arts.forEach(a => {
        let costStr = '';
        if (a.cost && typeof a.cost === 'object' && !Array.isArray(a.cost)) {
          const parts = [];
          if (a.cost.colors) Object.entries(a.cost.colors).forEach(([c, n]) => { for (let i = 0; i < n; i++) parts.push(c); });
          const specified = parts.length;
          if (a.cost.total > specified) { for (let i = 0; i < a.cost.total - specified; i++) parts.push('◇'); }
          costStr = parts.join('') || (a.cost.any ? '◇'.repeat(a.cost.any) : '0');
        } else if (Array.isArray(a.cost)) {
          costStr = a.cost.map(c => c.join ? c.join('') : c).join('');
        }
        const btn = el('button','act-btn',`⚔ アーツ${a.idx+1}（威力${a.power}／コスト${costStr}）`);
        btn.onclick = () => submit(a.idx);
        list.appendChild(btn);
      });
      const skipBtn = el('button','act-btn end','パス（攻撃しない）');
      skipBtn.onclick = () => submit('skip');
      list.appendChild(skipBtn);
      break;
    }
    case 'deckSearch': {
      const info = el('div','', `🔍 山札サーチ: ${decision.count}枚選択`);
      info.style.cssText = 'margin-bottom:8px;font-weight:bold;color:#ffca28';
      list.appendChild(info);
      list.appendChild(buildCardPicker(decision.candidates, '#ffca28', submit));
      break;
    }
    case 'revealChoice': {
      const info = el('div','', `📖 公開カードから${decision.count}枚選択`);
      info.style.cssText = 'margin-bottom:8px;font-weight:bold;color:#4fc3f7';
      list.appendChild(info);
      list.appendChild(buildCardPicker(decision.candidates, '#4fc3f7', submit));
      break;
    }
  }
}

/* Card-image picker used by deckSearch / revealChoice decisions.
   Falls back to a text tile when a candidate has no image URL. */
function buildCardPicker(candidates, accent, submit) {
  const grid = el('div','bv-pick-grid');
  candidates.forEach(c => {
    const tile = el('div','bv-pick-card');
    if (c.img) {
      const img = el('img','');
      img.src = c.img;
      img.alt = c.nm;
      img.loading = 'lazy';
      // Remote art may 404 — degrade to the name tile instead of a broken-image icon
      img.onerror = () => { img.replaceWith(el('div','bv-pick-ph', esc(c.nm))); };
      tile.appendChild(img);
    } else {
      tile.appendChild(el('div','bv-pick-ph', esc(c.nm)));
    }
    const typeLabel = c.t === 'holomen' ? (c.bl || 'Debut') : (c.t === 'support' ? 'サポート' : c.t);
    const cap = el('div','bv-pick-cap');
    cap.innerHTML = `<span class="nm">${esc(c.nm)}</span><span class="ty">${esc(typeLabel)}</span>`;
    tile.appendChild(cap);
    if (c.dup > 1) tile.appendChild(el('div','bv-pick-dup', `×${c.dup}`));
    tile.style.setProperty('--pick-accent', accent);
    tile.onclick = () => { hideCardPopup(); submit(c.idx); };
    if (c.n) attachPopupEvents(tile, c.n, null);
    grid.appendChild(tile);
  });
  return grid;
}

function showBattleResult(result, meKey) {
  const field = $('#bvField');
  const overlay = el('div','bv-result');
  const won = result.winner === meKey;
  overlay.innerHTML = `
    <h2 class="${won ? 'win-a' : 'win-b'}">${won ? '🎉 勝利！' : '😢 敗北…'}</h2>
    <div class="detail">${result.turns}ターン・${esc(result.reason || '')}</div>
    <button class="btn primary" id="bvClose">閉じる</button>`;
  field.appendChild(overlay);
  overlay.querySelector('#bvClose').onclick = () => closeBattle();

/* ===================== main-phase drag & drop =====================
   Pointer-events based (works with mouse and touch alike) so the player can
   drag a hand card onto a holomen to bloom it, onto the back row to place a
   Debut, or drag a back holomen onto the collab/center slot. The action
   buttons stay available as an equivalent fallback. */
let _drag = null;

/* Which mainAction (if any) a drag payload triggers when dropped on a target.
   `target` is {kind, holoId} read off the nearest [data-drop] ancestor. */
function dndActionFor(payload, target, actions) {
  for (const a of actions) {
    if (payload.kind === 'hand') {
      if (a.handIdx !== payload.idx) continue;
      if (a.act === 'bloom' && target.holoId != null && Number(target.holoId) === a.holoId) return a;
      if (a.act === 'placeDebut' && (target.kind === 'back' || target.kind === 'stage')) return a;
      // supports pick their own target later, so the stage as a whole is the zone —
      // dropping on an inner slot still resolves here by walking up (see dndResolve)
      if (a.act === 'playSupport' && target.kind === 'stage') return a;
    } else if (payload.kind === 'holo') {
      if (a.holoId !== payload.id) continue;
      if (a.act === 'collab' && target.kind === 'collab') return a;
      if (a.act === 'baton' && target.kind === 'center') return a;
    }
  }
  return null;
}

/* Walk outward from the dropped-on element: the innermost zone wins, but a
   miss falls through to its container (e.g. dropping a Debut on an occupied
   back slot still counts as dropping it on the back row). */
function dndResolve(payload, fromEl, actions) {
  let node = fromEl;
  while (node && node !== document.body) {
    if (node.dataset && node.dataset.drop) {
      const hit = dndActionFor(payload, { kind: node.dataset.drop, holoId: node.dataset.holoId }, actions);
      if (hit) return { action: hit, el: node };
    }
    node = node.parentElement;
  }
  return null;
}

function dndZones() { return [...document.querySelectorAll('#bvMeHalf [data-drop]')]; }

function dndBegin(sourceEl, payload, actions, ev) {
  // a drag cancels any pending long-press card popup
  clearTimeout(_popupTimer);
  hideCardPopup();
  const img = sourceEl.tagName === 'IMG' ? sourceEl : sourceEl.querySelector('img');
  const ghost = el('img','bv-drag-ghost');
  ghost.src = img ? img.src : '';
  document.body.appendChild(ghost);
  sourceEl.classList.add('bv-dragging');
  _drag = { payload, actions, ghost, sourceEl, hot: null };
  dndZones().forEach(z => {
    if (dndActionFor(payload, { kind: z.dataset.drop, holoId: z.dataset.holoId }, actions)) z.classList.add('bv-drop-ok');
  });
  dndMove(ev);
}

function dndMove(ev) {
  if (!_drag) return;
  _drag.ghost.style.left = ev.clientX + 'px';
  _drag.ghost.style.top = ev.clientY + 'px';
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  const hit = under ? dndResolve(_drag.payload, under, _drag.actions) : null;
  if (_drag.hot && _drag.hot !== (hit && hit.el)) { _drag.hot.classList.remove('bv-drop-hot'); _drag.hot = null; }
  if (hit) { hit.el.classList.add('bv-drop-hot'); _drag.hot = hit.el; }
}

function dndEnd(ev) {
  if (!_drag) return;
  const { payload, actions, ghost, sourceEl } = _drag;
  ghost.remove();
  sourceEl.classList.remove('bv-dragging');
  document.querySelectorAll('.bv-drop-ok,.bv-drop-hot').forEach(z => z.classList.remove('bv-drop-ok','bv-drop-hot'));
  _drag = null;
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  const hit = under ? dndResolve(payload, under, actions) : null;
  if (hit) dndSubmitMainAction(hit.action);
}

/* Submit a mainAction chosen by dropping, mirroring what the buttons do. */
function dndSubmitMainAction(action) {
  const pd = _pendingDecision;
  if (!pd || pd.type !== 'mainAction') return;
  _pendingDecision = null;
  $('#bvActions').style.display = 'none';
  pd.driver.submitChoice(action);
}

/* Arm an element as a drag source. Only starts once the pointer clears a small
   threshold, so taps and long-press still behave normally. */
function dndMakeDraggable(elm, payload, actions) {
  elm.classList.add('bv-draggable');
  elm.addEventListener('pointerdown', (e) => {
    if (e.button != null && e.button !== 0) return;
    if (!_pendingDecision || _pendingDecision.type !== 'mainAction') return;
    const x0 = e.clientX, y0 = e.clientY;
    let started = false;
    const onMove = (ev) => {
      if (!started) {
        if (Math.hypot(ev.clientX - x0, ev.clientY - y0) < 8) return;
        started = true;
        dndBegin(elm, payload, actions, ev);
      } else {
        ev.preventDefault();
        dndMove(ev);
      }
    };
    const onUp = (ev) => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if (started) dndEnd(ev);
    };
    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

    case 'bloom':

    case 'collab':

    case 'downed':

    case 'supportUsed':

}

/* ===================== online match (P2P via PeerJS) =====================
   The host runs the only engine and is authoritative. The guest is a thin
   client: it renders snapshots the host sends and posts its choices back. */
const PEERJS_SRC = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
const ROOM_PREFIX = 'holoca-vs-';
let _net = null; // { peer, conn, role }

function loadPeerJS() {
  if (window.Peer) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = PEERJS_SRC;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('通信ライブラリの読み込みに失敗しました'));
    document.head.appendChild(s);
  });
}

function newRoomCode() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no easily-confused characters
  let s = '';
  for (let i = 0; i < 6; i++) s += abc[Math.floor(Math.random() * abc.length)];
  return s;
}

function netTeardown() {
  if (!_net) return;
  try { if (_net.conn) _net.conn.close(); } catch (e) {}
  try { if (_net.peer) _net.peer.destroy(); } catch (e) {}
  _net = null;
}

/* The opponent's deck arrives over the wire, so validate it before handing it to
   the engine — a malformed payload must not be able to break the host's game. */
function sanitizeRemoteDeck(d) {
  if (!d || typeof d !== 'object') return null;
  const oshi = d.oshi;
  if (typeof oshi !== 'string' || !BYNUM.has(oshi)) return null;
  const cleanPile = (pile, maxTotal) => {
    if (!pile || typeof pile !== 'object') return null;
    const out = {}; let total = 0;
    for (const [n, cnt] of Object.entries(pile)) {
      if (!BYNUM.has(n)) return null;
      if (!Number.isInteger(cnt) || cnt < 1 || cnt > 50) return null;
      out[n] = cnt; total += cnt;
    }
    if (total < 1 || total > maxTotal) return null;
    return out;
  };
  const main = cleanPile(d.main, 60);
  const cheer = cleanPile(d.cheer, 30);
  if (!main || !cheer) return null;
  const name = typeof d.name === 'string' ? d.name.slice(0, 24) : '対戦相手';
  return { v: 1, name, oshi, main, cheer };
}

function onlineStatus(msg) {
  const s = $('#bOnStatus');
  if (s) s.textContent = msg;
}

/* --- host --- */
async function hostOnlineMatch(myDeck) {
  netTeardown();
  onlineStatus('通信を準備しています…');
  try { await loadPeerJS(); } catch (e) { onlineStatus(e.message); return; }
  const code = newRoomCode();
  const peer = new Peer(ROOM_PREFIX + code, { debug: 0 });
  _net = { peer, conn: null, role: 'host' };
  peer.on('open', () => {
    const box = $('#bOnlineRoom');
    if (box) {
      box.style.display = '';
      $('#bRoomCode').textContent = code;
    }
    onlineStatus('相手の参加を待っています…');
  });
  peer.on('error', (err) => {
    onlineStatus('接続エラー: ' + (err && err.type ? err.type : err));
  });
  peer.on('connection', (conn) => {
    if (_net && _net.conn) { try { conn.close(); } catch (e) {} return; } // one opponent only
    _net.conn = conn;
    conn.on('open', () => onlineStatus('相手が接続しました。デッキを待っています…'));
    conn.on('data', (m) => {
      if (!m || typeof m !== 'object') return;
      if (m.t === 'hello') {
        const guestDeck = sanitizeRemoteDeck(m.deck);
        if (!guestDeck) {
          onlineStatus('相手のデッキが不正です。対戦を中止しました。');
          try { conn.send({ t: 'reject', reason: 'デッキが不正です' }); } catch (e) {}
          return;
        }
        conn.send({ t: 'start' });
        closeDlg();
        startOnlineHostBattle(myDeck, guestDeck, conn);
      } else if (m.t === 'choice') {
        if (_battleDriver) _battleDriver.submitChoice(m.v);
      }
    });
    conn.on('close', () => { toast('相手との接続が切れました'); });
  });
}

function startOnlineHostBattle(deckA, deckB, conn) {
  const meKey = 'A', opKey = 'B';
  const game = HoloEngine.createInteractiveGame(deckA, deckB, ENGINE_DB);
  resetBattleView();
  const send = (o) => { try { conn.send(o); } catch (e) {} };
  const driver = new HoloEngine.BattleDriver(game, meKey, {
    aiDelay: 500,
    remotePlayer: opKey,
    // snapshot per viewer so neither side ever receives the other's hand
    onState: () => {
      renderBattleState(HoloEngine.snapshot(game, meKey), meKey);
      send({ t: 'state', snap: HoloEngine.snapshot(game, opKey) });
    },
    onDecision: (d) => showDecision(d, driver, meKey),
    onRemoteDecision: (d) => {
      send({ t: 'decision', d });
      $('#bvActions').style.display = 'none';
      showEventToast('相手の操作を待っています…', 1500);
    },
    onEnd: (r) => { showBattleResult(r, meKey); send({ t: 'end', r }); },
    onLog: (d) => { handleBattleEvent(d, meKey); send({ t: 'event', d }); },
  });
  _battleDriver = driver;
  driver.run(60);
}

/* --- guest --- */
async function joinOnlineMatch(code, myDeck) {
  netTeardown();
  onlineStatus('通信を準備しています…');
  try { await loadPeerJS(); } catch (e) { onlineStatus(e.message); return; }
  const peer = new Peer({ debug: 0 });
  _net = { peer, conn: null, role: 'guest' };
  peer.on('error', (err) => {
    const type = err && err.type;
    onlineStatus(type === 'peer-unavailable'
      ? 'その合言葉の部屋が見つかりません'
      : '接続エラー: ' + (type || err));
  });
  peer.on('open', () => {
    onlineStatus('部屋に接続しています…');
    const conn = peer.connect(ROOM_PREFIX + code, { reliable: true });
    _net.conn = conn;
    conn.on('open', () => {
      onlineStatus('接続しました。対戦開始を待っています…');
      conn.send({ t: 'hello', deck: myDeck });
    });
    conn.on('data', (m) => {
      if (!m || typeof m !== 'object') return;
      if (m.t === 'reject') { onlineStatus('参加を断られました: ' + (m.reason || '')); return; }
      if (m.t === 'start') { closeDlg(); startOnlineGuestBattle(conn); }
    });
    conn.on('close', () => { toast('相手との接続が切れました'); });
  });
}

function startOnlineGuestBattle(conn) {
  const meKey = 'B';
  resetBattleView();
  $('#bvTurn').textContent = 'オンライン対戦';
  // The guest has no engine; this stands in for the driver where the battle UI
  // needs one (submitting choices, and stopping on quit).
  const stub = {
    game: null,
    humanPlayer: meKey,
    submitChoice: (v) => { try { conn.send({ t: 'choice', v }); } catch (e) {} },
    stop: () => netTeardown(),
  };
  _battleDriver = stub;
  conn.on('data', (m) => {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'state') renderBattleState(m.snap, meKey);
    else if (m.t === 'event') handleBattleEvent(m.d, meKey);
    else if (m.t === 'decision') showDecision(m.d, stub, meKey);
    else if (m.t === 'end') showBattleResult(m.r, meKey);
  });
}

/* ===================== card popup (battle view) ===================== */
const _popup = $('#cardPopup');
const _popupImg = $('#cpImg');
const _popupBody = $('#cpBody');
let _popupTimer = null;

function buildPopupHTML(cardNum, holo) {
  const c = BYNUM.get(cardNum);
  if (!c) return '';
  const tx = c.tx || {};
  let html = `<div class="cp-name">${esc(c.nm)}</div>`;
  html += `<div class="cp-meta">`;
  html += `<span>${c.n}</span>`;
  if (c.bl) html += `<span>${c.bl}</span>`;
  if (c.t === 'oshi') html += `<span>推しホロメン</span>`;
  else if (c.t === 'support') html += `<span>サポート${c.st ? '・'+c.st : ''}</span>`;
  else if (c.t === 'holomen') html += `<span>ホロメン</span>`;
  if (c.c && c.c.length) html += `<span>${c.c.join('/')}</span>`;
  if (c.bt) html += `<span>バトン${c.bt}</span>`;
  html += `</div>`;
  if (holo || c.hp) {
    html += `<div class="cp-stats">`;
    if (c.hp) html += `<span class="hp">HP ${c.hp}</span>`;
    if (holo && holo.dmg) html += `<span class="dmg">ダメージ ${holo.dmg}</span>`;
    if (holo && holo.cheer) html += `<span class="cheer">エール ${holo.cheer.length}枚</span>`;
    if (c.lf) html += `<span>LIFE ${c.lf}</span>`;
    html += `</div>`;
  }
  let txHtml = '';
  const addTx = (lab, val) => { if (val) txHtml += `<span class="cp-label">${lab}</span>${esc(val)}\n`; };
  addTx('推しスキル', tx.o);
  addTx('SP推しスキル', tx.s);
  if (tx.k) tx.k.forEach(k => addTx('キーワード', k));
  if (tx.a) tx.a.forEach(a => addTx('アーツ', a));
  addTx('能力テキスト', tx.b);
  if (txHtml) html += `<div class="cp-text">${txHtml}</div>`;
  if (holo && holo.attachments && holo.attachments.length) {
    html += `<div class="cp-attach">`;
    holo.attachments.forEach(att => {
      const ac = BYNUM.get(att.n);
      html += `<span class="att-name">📎 ${esc(att.nm || (ac && ac.nm) || att.n)}</span> `;
    });
    html += `</div>`;
  }
  return html;
}

function showCardPopup(cardNum, holo, anchorEl) {
  const c = BYNUM.get(cardNum);
  if (!c) return;
  _popupImg.src = c.img || '';
  _popupImg.alt = c.nm;
  _popupImg.style.display = c.img ? '' : 'none';
  _popupBody.innerHTML = buildPopupHTML(cardNum, holo);
  _popup.classList.add('on');
  requestAnimationFrame(() => positionPopup(anchorEl));
}

function positionPopup(anchor) {
  const r = anchor.getBoundingClientRect();
  const pw = _popup.offsetWidth, ph = _popup.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = r.right + 8;
  if (left + pw > vw) left = r.left - pw - 8;
  if (left < 4) left = 4;
  let top = r.top;
  if (top + ph > vh) top = vh - ph - 4;
  if (top < 4) top = 4;
  _popup.style.left = left + 'px';
  _popup.style.top = top + 'px';
}

function hideCardPopup() {
  clearTimeout(_popupTimer);
  _popupTimer = null;
  _popup.classList.remove('on');
}

function attachPopupEvents(el, cardNum, holo) {
  el.addEventListener('mouseenter', () => {
    clearTimeout(_popupTimer);
    _popupTimer = setTimeout(() => showCardPopup(cardNum, holo, el), 350);
  });
  el.addEventListener('mouseleave', () => hideCardPopup());
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    clearTimeout(_popupTimer);
    showCardPopup(cardNum, holo, el);
    const dismiss = () => { hideCardPopup(); document.removeEventListener('click', dismiss); };
    setTimeout(() => document.addEventListener('click', dismiss), 50);
  });
  el.addEventListener('touchstart', (e) => {
    _popupTimer = setTimeout(() => {
      e.preventDefault();
      showCardPopup(cardNum, holo, el);
      const dismiss = () => { hideCardPopup(); document.removeEventListener('touchstart', dismiss); };
      setTimeout(() => document.addEventListener('touchstart', dismiss), 50);
    }, 400);
  }, {passive: false});
  el.addEventListener('touchend', () => { if (_popupTimer) { clearTimeout(_popupTimer); _popupTimer = null; } });
}
